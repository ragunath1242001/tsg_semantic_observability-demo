server:
  port: 3004
  listen: "0.0.0.0"
  publicAddress: http://localhost:3004

db:
  type: "sqlite"
  database: "sso-bridge-db.sqlite"

# Optional: Customize the issuer name shown in authenticator apps for 2FA
# twoFactorIssuerName: "My Organization SSO"

initClients:
  - clientId: "test-client"
    clientSecret: "test-secret"
    secretName: "k8s-secret-name"
    redirectUris:
      - "http://localhost:3000"
    permissions:
      - manage:user
      - manage:client
      - read:config
      - read:logs
    name: "Test Client"
    description: "This is a test client"

initUsers:
  - username: "alice"
    password: "password"
    email: "alice@example.com"
    permissions:
      - manage:user
      - manage:client
      - read:config
      - read:logs
    require2FA: false # Optional: Enable two-factor authentication (default: false)

  - username: "bob"
    password: "password"
    email: "bob@example.com"
    permissions:
      - read:config

  - username: "viewer"
    password: "password"
    email: "viewer@example.com"
    permissions:
      - read:config
