.build:
  extends:
    - .base-rules
    - .pnpm-cache-readonly
  stage: build
  needs:
    - job: warm-cache
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH != "main"
      changes:
        - "*/$APP*/**/*"
        - "libs/common*/**/*"
        - apps/apps.gitlab-ci.yml
        - .gitlab-ci.yml
  tags:
    - saas-linux-medium-amd64
  script:
    - pnpm install --frozen-lockfile
    - pnpm run --filter "./libs/common*" --filter "./libs/wallet-dtos" -r  build
    - pnpm run --filter "./libs/$APP*" --parallel -r  build
    - pnpm run --filter "./apps/$APP*" --parallel -r  build

.test:
  extends:
    - .base-rules
    - .pnpm-cache-readonly
  stage: test
  needs:
    - job: warm-cache
      optional: true
  tags:
    - saas-linux-medium-amd64
  rules:
    - if: $CI_COMMIT_BRANCH != "main"
      changes:
        - "apps/$APP-api/**/*"
        - "libs/$APP-dtos/**/*"
        - "libs/common-dsp/**/*"
        - "libs/common-utils/**/*"
        - apps/apps.gitlab-ci.yml
        - .gitlab-ci.yml
  script:
    - pnpm install --frozen-lockfile
    - pnpm run --filter "./libs/common*" --filter "./libs/wallet-dtos" -r  build
    - pnpm run --filter "./libs/$APP*" --parallel -r  build
    - pnpm test:$APP-ci
  coverage: /All files[^|]*\|[^|]*\s+([\d\.]+)/
  artifacts:
    reports:
      junit:
        - apps/$APP-api/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: apps/$APP-api/coverage/cobertura-coverage.xml

.migrations-check:
  extends:
    - .base-rules
    - .pnpm-cache-readonly
  stage: test
  needs:
    - job: warm-cache
      optional: true
  tags:
    - saas-linux-medium-amd64
  rules:
    - if: $CI_COMMIT_BRANCH != "main"
      changes:
        - "apps/$APP-api/**/*"
        - "libs/$APP-dtos/**/*"
        - "libs/common-dsp/**/*"
        - apps/apps.gitlab-ci.yml
        - .gitlab-ci.yml
  script:
    - pnpm install --frozen-lockfile
    - pnpm run --filter "./libs/common*" --filter "./libs/wallet-dtos" -r  build
    - pnpm run --filter "./libs/$APP*" --parallel -r  build
    - pnpm run --filter "./apps/$APP-api" migrations:check

.package:
  stage: package
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  tags:
    - saas-linux-medium-amd64
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n $CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD | base64)\"}}}" > /kaniko/.docker/config.json
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
      --build-arg BUILD_SHA=${CI_COMMIT_SHORT_SHA}
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile-$APP"
      --destination "${CI_REGISTRY_IMAGE}/$APP:${CI_COMMIT_REF_NAME}"
      $(if [ "$CI_PIPELINE_SOURCE" == "merge_request_event" ]; then echo "--no-push --no-push-cache"; fi)
  rules:
    - if: '$RELEASE_NOW == "true"'
      when: never
    - if: "$CI_COMMIT_TAG"
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

.package-version:
  stage: package
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  tags:
    - saas-linux-medium-amd64
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n $CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD | base64)\"}}}" > /kaniko/.docker/config.json
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
      --build-arg BUILD_SHA=${CI_COMMIT_SHORT_SHA}
      --build-arg TSG_MODE=production
      --build-arg TSG_VERSION=${CI_COMMIT_REF_NAME}
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile-$APP"
      --destination "${CI_REGISTRY_IMAGE}/$APP:${CI_COMMIT_REF_NAME}"
      $(if [ "$CI_PIPELINE_SOURCE" == "merge_request_event" ]; then echo "--no-push --no-push-cache"; fi)
  rules:
    - if: "$CI_COMMIT_TAG"

# Matrix jobs for all apps
build:
  extends:
    - .build
  parallel:
    matrix:
      - APP: wallet
      - APP: control-plane
      - APP: http-data-plane
      - APP: analytics-data-plane
      - APP: sso-bridge

test:
  extends:
    - .test
  parallel:
    matrix:
      - APP: wallet
      - APP: control-plane
      - APP: http-data-plane
      - APP: analytics-data-plane
      - APP: sso-bridge

migrations-check:
  extends:
    - .migrations-check
  parallel:
    matrix:
      - APP: wallet
      - APP: control-plane
      - APP: http-data-plane
      - APP: analytics-data-plane
      - APP: sso-bridge

package:
  extends: .package
  needs:
    - job: test
      optional: true
      parallel:
        matrix:
          - APP: ${APP}
    - job: migrations-check
      optional: true
      parallel:
        matrix:
          - APP: ${APP}
    - job: lint
      optional: true
    - job: config_docs
      optional: true
    - job: openapi
      optional: true
  parallel:
    matrix:
      - APP: wallet
      - APP: control-plane
      - APP: http-data-plane
      - APP: analytics-data-plane
      - APP: sso-bridge

package-version:
  extends: .package-version
  parallel:
    matrix:
      - APP: wallet
      - APP: control-plane
      - APP: http-data-plane
      - APP: analytics-data-plane
      - APP: sso-bridge
