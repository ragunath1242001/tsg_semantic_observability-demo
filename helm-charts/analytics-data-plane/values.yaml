image:
  repository: registry.gitlab.com/tno-tsg/dataspace-protocol/tno-security-gateway/analytics-data-plane
  tag: "v{{ .Chart.Version }}"
replicaCount: 1

host: example.com

resources:
  requests:
    memory: "200Mi"
    cpu: "100m"
  limits:
    memory: "350Mi"
    cpu: "1150m"

serviceAccount:
  create: true
  annotations: {}
  automount: true
  rules:
    - apiGroups: ["batch"]
      resources: ["jobs"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    - apiGroups: [""]
      resources: ["pods", "pods/log"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["apps"]
      resources: ["replicasets"]
      verbs: ["get", "list"]
    - apiGroups: [""]
      resources: ["configmaps"]
      verbs: ["get", "create", "update", "patch", "delete"]
ingress:
  enabled: true
  clusterIssuer: letsencrypt
  paths:
    - path: '{{ template "tsg.subPath" $ }}/'
      type: Prefix

env:
  - name: POD_IP
    valueFrom:
      fieldRef:
        fieldPath: status.podIP
configFromSecrets: {}

subPath: ""

persistentVolume:
  name: "analytics-data-plane-pvc"
  mountPath: "/uploads"
  storageSize: 1Gi

config:
  server:
    port: 3000
    listen: "0.0.0.0"
    publicDomain: "{{ .Values.host }}"
    publicAddress: https://{{ .Values.host }}{{ template "tsg.subPath" $ }}
  auth:
    openIdConfigurationURL: "https://{{ .Values.host }}/.well-known/openid-configuration"
    callbackURL: https://{{ .Values.host }}{{ template "tsg.subPath" $ }}/api/auth/callback
    redirectURL: https://{{ .Values.host }}{{ template "tsg.subPath" $ }}/
    rolePath: "$.roles[*]"
