apiVersion: v1
kind: Service
metadata:
  name: {{ template "http-data-plane.fullname" . }}
  labels: {{ include "http-data-plane.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ template "http-data-plane.fullname" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
