#   db:
#     password:
#       name: postgresql
#       key: password

config:
  server:
    port: 3000
    listen: "0.0.0.0"
    publicDomain: "{{ .Values.host }}"
    publicAddress: https://{{ .Values.host }}/control-plane
  db:
    type: postgres
    database: controlplane
    host: # postgresql
    port: 5432
    username: postgres
