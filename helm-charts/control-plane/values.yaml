host: # example.com
image:
  repository: registry.gitlab.com/tno-tsg/dataspace-protocol/tno-security-gateway/control-plane
  tag: "v{{ .Chart.Version }}"
replicaCount: 1

ingress:
  enabled: true
  clusterIssuer: letsencrypt
  path: /control-plane(/|$)(.*)
  rewriteTarget: /$2
  # annotations: {}
  # class: nginx

env: []
configFromSecrets: {}
