image:
  repository: registry.gitlab.com/tno-tsg/dataspace-protocol/tno-security-gateway/control-plane
  tag: "v{{ .Chart.Version }}"
replicaCount: 1

host:

resources:
  requests:
    memory: "200Mi"
    cpu: "100m"
  limits:
    memory: "350Mi"
    cpu: "1150m"

serviceAccount:
  create: false

ingress:
  enabled: true
  clusterIssuer: letsencrypt
  paths:
    - path: '{{ template "tsg-core.subPath" $ }}/'
      type: Prefix
    - path: /.well-known/dspace-version
      type: ImplementationSpecific
    - path: /socket.io
      type: ImplementationSpecific

env: []
configFromSecrets: {}

subPath: ""

config:
  server:
    port: 3000
    listen: "0.0.0.0"
    publicDomain: "{{ .Values.host }}"
    publicAddress: https://{{ .Values.host }}/control-plane
  db:
    type: postgres
    database: controlplane
    host: postgresql
    port: 5432
    username: postgres
  auth:
    openIdConfigurationURL: "https://{{ .Values.host }}/.well-known/openid-configuration"
    callbackURL: https://{{ .Values.host }}{{ template "tsg-core.subPath" $ }}/api/auth/callback
    redirectURL: https://{{ .Values.host }}{{ template "tsg-core.subPath" $ }}/
    # For private_key_jwt authentication, use one of the following:
    # Option 1: File-based private key (recommended)
    # privateKeyJwkFile: "/var/secrets/private-key.jwk"
    # Option 2: Inline private key (not recommended for production)
    # privateKeyJwk: { ... }
# Example secret mount configuration for private key
# secretMounts:
#   - name: oauth-private-key
#     secretName: control-plane-oauth-private-key
#     mountPath: "/var/secrets"
#     items:
#       - key: "private-key.jwk"
#         path: "private-key.jwk"
