image: dtzar/helm-kubectl:3.14

stages:
  - release

.release:
  stage: release
  tags:
    - saas-linux-small-amd64
  script:
    - cd helm-charts/$FOLDER
    - helm dep update
    - VERSION=$(grep -m 1 '^version:' Chart.yaml | awk '{ print $2}')
    # replace / with -
    - BRANCH_NAME=${CI_COMMIT_REF_NAME/\//-}
    - helm package --version "$VERSION-$BRANCH_NAME" .
    - curl --request POST --user gitlab-ci-token:$CI_JOB_TOKEN --form "chart=@$( ls *.tgz | head -n1 )" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/helm/api/devel/charts"
  rules:
    - if: $CI_COMMIT_BRANCH != "main"
      changes:
        - "helm-charts/$FOLDER/**/*"
        - .gitlab-ci.yml

.release_version:
  stage: release
  tags:
    - saas-linux-small-amd64
  script:
    - cd helm-charts/$FOLDER
    - helm dep update
    - helm package .
    - curl --request POST --user gitlab-ci-token:$CI_JOB_TOKEN --form "chart=@$( ls *.tgz | head -n1 )" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/helm/api/stable/charts"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - "helm-charts/$FOLDER/**/*"
        - .gitlab-ci.yml

helm-devel:control-plane:
  extends: .release
  variables:
    FOLDER: control-plane

helm-stable:control-plane:
  extends: .release_version
  variables:
    FOLDER: control-plane

helm-devel:wallet:
  extends: .release
  variables:
    FOLDER: wallet

helm-stable:wallet:
  extends: .release_version
  variables:
    FOLDER: wallet

helm-devel:http-data-plane:
  extends: .release
  variables:
    FOLDER: http-data-plane

helm-stable:http-data-plane:
  extends: .release_version
  variables:
    FOLDER: http-data-plane

helm-devel:casdoor:
  extends: .release
  variables:
    FOLDER: casdoor

helm-stable:casdoor:
  extends: .release_version
  variables:
    FOLDER: casdoor
