{{- if .Values.ingress.enabled }}
{{- with .Values.ingress }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ template "wallet.fullname" $ }}-ingress
  labels: {{ include "wallet.labels" $ | nindent 4 }}
  annotations:
    {{- if .clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .clusterIssuer }}
    {{- end }}
    {{- with .annotations }}
    {{- tpl (toYaml . ) $ | nindent 4 }}
    {{- end }}
    kubernetes.io/ingress.class: {{ .class | default "nginx" }}
spec:
  tls:
  - hosts:
    - {{ $.Values.host }}
    secretName: {{ $.Values.host }}-tls-secret
  rules:
  - host: {{ $.Values.host }}
    http:
      paths:
      - backend:
          service:
            name: {{ template "wallet.fullname" $ }}
            port: 
              number: 3000
        path: /
        pathType: Prefix
{{- end }}
{{- end }}