server:
  publicAddress: http://localhost:3602
  publicDomain: localhost:3602
  port: 3602
  listen: "0.0.0.0"

db:
  type: "sqlite"
  database: "bravo.db"

auth:
  enabled: false

controlPlane:
  dataPlaneEndpoint: http://localhost:3601/data-plane
  managementEndpoint: http://localhost:3601/management
  controlEndpoint: http://localhost:3601

runtime:
  color: "#3B8BF6"

dataset:
  type: versioned
  title: MockHTTP Bravo
  description:
    - A dataset containing data from MockHTTP, used for testing and demonstration purposes.
  currentVersion: 0.9.2
  versions:
    - version: 0.9.2
      distributions:
        - backendUrl: https://mockhttp.org/
          openApiSpecRef: https://mockhttp.org/docs/json
    - version: 0.9.1
      distributions:
        - backendUrl: https://mockhttp.org/anything
          openApiSpecRef: https://api-specs.ids.smart-connected.nl/specs/scsn/1.0.3.yaml
    - version: 0.9.0
      distributions:
        - backendUrl: https://mockhttp.org/anything
          openApiSpecRef: https://petstore3.swagger.io/api/v3/openapi.json
    - version: 0.8.0
      distributions:
        - backendUrl: https://mockhttp.org/anything
          openApiSpecRef: https://tsg.dataspac.es/docs/next/apis/control-plane/openapi.yaml
