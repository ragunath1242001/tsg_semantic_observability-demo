server:
  publicAddress: http://localhost:3603
  publicDomain: localhost:3603
  port: 3603
  listen: "0.0.0.0"

db:
  type: "sqlite"
  database: "bravo-client.db"

auth:
  enabled: true
  openIdConfigurationURL: http://localhost:3700/.well-known/openid-configuration
  callbackURL: http://localhost:3653/api/auth/callback
  clientId: bravo-analytics-data-plane-client
  clientSecret: bravo-analytics-data-plane-client
  rolePath: "$.roles[*]"
  redirectURL: http://localhost:3653/

controlPlane:
  dataPlaneEndpoint: http://localhost:3601/data-plane
  managementEndpoint: http://localhost:3601/management
  controlEndpoint: http://localhost:3601
  walletEndpoint: http://localhost:3600

runtime:
  color: "#3B8BF6"

files:
  path: "./uploads"

orchestration:
  type: "docker"
  mountFiles: false

split:
  mode: client
  bridgePeerWsUrl: "ws://localhost:3602"
