server:
  port: 3700
  listen: "0.0.0.0"
  publicAddress: http://localhost:3750
  publicDomain: localhost

db:
  type: "sqlite"
  database: "sso-bridge.db"

twoFactorIssuerName: "TSG Local SSO Bridge"

initClients:
  # Authority clients
  - clientId: authority-wallet
    name: Authority Wallet
    description: Authority Wallet
    tokenEndpointAuthMethod: private_key_jwt
    jwk:
      kty: EC
      x: 7s2R3zVi4FI8BRZ0979i-NGrmA13xGk1eOoYo5Gy2Tc
      y: 3bMs_vp_cJKOI4nFVhGQywMvJDveGblOYpQd4uMAXDk
      crv: P-256
      kid: authority-wallet-key-1767782795718
      alg: ES256
      use: sig
    redirectUris:
      - http://localhost:3450/.*
    permissions:
      - execute:sso.config
    secretName: sso-authority-wallet-secret

  # Alfa clients
  - clientId: alfa-wallet
    name: Alfa Wallet
    description: Alfa Wallet
    tokenEndpointAuthMethod: private_key_jwt
    jwk:
      kty: EC
      x: TNroQXAH5gSedz9Wh5Gwb36PqPbQcUUhDjoaOkuOVP4
      y: oxlGyXlgptnf93RBtGOG1TXBo3_xC8nJyNXMylJ3CHs
