      crv: P-256
      kid: alfa-control-plane-key-1767782613388
      alg: ES256
      use: sig
    redirectUris:
      - http://localhost:3551/.*
    permissions:
      - execute:sso.config
      - read:w.did
      - manage:w.issue_config
      - execute:w.key
      - read:w.credential
      - read:w.presentation
      - manage:dp.*
