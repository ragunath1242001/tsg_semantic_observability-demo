server:
  publicAddress: http://localhost:3500
  publicDomain: localhost:3500
  port: 3500
  listen: "0.0.0.0"

db:
  type: "sqlite"
  database: "alfa.db"

auth:
  enabled: true
  openIdConfigurationURL: http://localhost:3700/.well-known/openid-configuration
  callbackURL: http://localhost:3550/api/auth/callback
  clientId: alfa-wallet
  clientSecret: alfa-wallet
  rolePath: "$.roles[*]"
  redirectURL: http://localhost:3550/

initKeys:
  - id: key-0
    type: EdDSA
    default: true

runtime:
  title: Alfa
  color: "#3B8BF6"
  acceptUnauthenticatedCredentialRequests: true
  issueMobileCredentials: true
  issueDebugCredentials: true

issuance:
  dcp:
    - credentialType:
        - ExampleCredential
      issuerId: did:web:localhost%3A3400
      preAuthorizedCode: 386527fd21960fd8bd3aa0208c9275a4437fde1bdae9469daaf91fb7cace67d827ff152e5f89c02ccdbde1766387feb2

trustAnchors:
  - identifier: did:web:localhost%3A3400
    credentialTypes:
      - ExampleCredential
      - alfa:ExampleCredential
      - http://localhost:3400/credentials/ExampleCredential

didServices:
  - id: did:web:localhost%3A3500#control-plane
    type: connector
    serviceEndpoint: http://localhost:3501/

did:
  method: "did:web:"

issueConfigurations:
  - id: ProjectAgreementCredential
    credentialType: ProjectAgreementCredential
    description: Project Agreement Credential
    document:
      "@context":
        "@protected": true
        "@version": 1.1
        ProjectAgreementCredential:
          "@context":
            - https://www.w3.org/ns/credentials/v2
          "@id": adp:ProjectAgreementCredential
        adp: https://tsg.dataspac.es/context/adp
        hash: "https://w3id.org/security#hash"
        id: "@id"
        type: "@type"
