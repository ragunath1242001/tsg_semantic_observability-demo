server:
  publicAddress: http://localhost:3602
  publicDomain: localhost:3602
  port: 3602
  listen: "0.0.0.0"

db:
  type: "sqlite"
  database: "bravo-server.db"

auth:
  enabled: true
  openIdConfigurationURL: http://localhost:3700/.well-known/openid-configuration
  callbackURL: http://localhost:3652/api/auth/callback
  clientId: bravo-analytics-data-plane-server
  clientSecret: bravo-analytics-data-plane-server
  rolePath: "$.roles[*]"
  redirectURL: http://localhost:3652/

controlPlane:
  dataPlaneEndpoint: http://localhost:3601/data-plane
  managementEndpoint: http://localhost:3601/management
  controlEndpoint: http://localhost:3601
  walletEndpoint: http://localhost:3600

runtime:
  color: "#3B8BF6"

files:
  path: "./uploads"

split:
  mode: server
