apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "control-plane.fullname" . }}
  labels: {{ include "control-plane.labels" $ | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ template "control-plane.fullname" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ template "control-plane.fullname" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: control-plane
          image: "{{ .Values.image }}"
          imagePullPolicy: Always
          {{- with .Values.env }}
          env: {{ toYaml . | nindent 12 }}
          {{- end }}
          resources:
            requests:
              memory: "100Mi"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
          volumeMounts:
          - name: control-plane-config
            mountPath: /app/config.yaml
            subPath: "config.yaml"
      volumes:
      - name: control-plane-config
        configMap:
          name: {{ template "control-plane.fullname" . }}-config
