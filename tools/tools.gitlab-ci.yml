.npm-package:
  extends: .base-rules
  stage: package
  script:
    - echo "//registry.npmjs.org/:_authToken=${NPMJS_TOKEN}" >> .npmrc
    - pnpm install --frozen-lockfile
    - pnpm --filter cli build
    - pnpm --filter cli publish --no-git-checks
  rules:
    - if: '$RELEASE_NOW == "true"'
      when: never
    - if: $CI_COMMIT_TAG

cli-package:
  extends: .npm-package
