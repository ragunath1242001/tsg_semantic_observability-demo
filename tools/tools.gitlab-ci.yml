.npm-package:
  extends:
    - .base-rules
    - .pnpm-cache-readonly
  stage: package
  rules:
    - if: '$RELEASE_NOW == "true"'
      when: never
    - if: $CI_COMMIT_TAG

cli-build:
  extends:
    - .base-rules
    - .pnpm-cache-readonly
  stage: build
  needs:
    - job: warm-cache
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH != "main"
      changes:
        - "tools/cli/**/*"
        - tools/tools.gitlab-ci.yml
        - .gitlab-ci.yml
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter cli build

cli-package:
  extends: .npm-package
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter cli build
    - pnpm --filter cli publish --no-git-checks

tui-build:
  extends:
    - .base-rules
    - .pnpm-cache-readonly
  stage: build
  needs:
    - job: warm-cache
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH != "main"
      changes:
        - "tools/adp-client-tui/**/*"
        - tools/tools.gitlab-ci.yml
        - .gitlab-ci.yml
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter adp-client-tui build

tui-package:
  extends: .npm-package
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter adp-client-tui build
    - pnpm --filter adp-client-tui publish --no-git-checks

e2e-dsp-local:
  extends:
    - .base-rules
    - .pnpm-cache-readonly
  stage: test
  needs:
    - job: warm-cache
      optional: true
  tags:
    - saas-linux-medium-amd64
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - pnpm install --frozen-lockfile
    - pnpm build:libs
    - pnpm run --filter control-plane-api build
    - pnpm e2e:dsp-local

dsp-tck-fetch:
  image:
    name: eclipsedataspacetck/dsp-tck-runtime:1.0.0-RC4
    entrypoint:
      - "/bin/sh"
      - "-c"
  stage: build
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: "$CI_COMMIT_TAG"
  script:
    - echo "Fetching TCK test cases"
    - mkdir -p tools/e2e-testing/assets
    - cp /app/tck-runtime.jar tools/e2e-testing/assets/dsp-tck-runtime.jar
  artifacts:
    paths:
      - tools/e2e-testing/assets/dsp-tck-runtime.jar
    expire_in: 1 hour

adp-client-tui-package:
  stage: package
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  tags:
    - saas-linux-medium-amd64
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n $CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD | base64)\"}}}" > /kaniko/.docker/config.json
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
      --build-arg BUILD_SHA=${CI_COMMIT_SHORT_SHA}
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile-adp-client-tui"
      --destination "${CI_REGISTRY_IMAGE}/adp-client-tui:${CI_COMMIT_REF_NAME}"
      $(if [ "$CI_PIPELINE_SOURCE" == "merge_request_event" ]; then echo "--no-push --no-push-cache"; fi)
  rules:
    - if: '$RELEASE_NOW == "true"'
      when: never
    - if: "$CI_COMMIT_TAG"
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "tools/adp-client-tui/**/*"
        - Dockerfile-adp-client-tui
        - tools/tools.gitlab-ci.yml
        - .gitlab-ci.yml

adp-client-tui-package-version:
  stage: package
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  tags:
    - saas-linux-medium-amd64
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n $CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD | base64)\"}}}" > /kaniko/.docker/config.json
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
      --build-arg BUILD_SHA=${CI_COMMIT_SHORT_SHA}
      --build-arg TSG_VERSION=${CI_COMMIT_REF_NAME}
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile-adp-client-tui"
      --destination "${CI_REGISTRY_IMAGE}/adp-client-tui:${CI_COMMIT_REF_NAME}"
  rules:
    - if: "$CI_COMMIT_TAG"

e2e-dsp-tck:
  extends:
    - .base-rules
    - .pnpm-cache-readonly
  stage: test
  allow_failure: true
  variables:
    DISABLE_TCK_FETCH: "true"
  needs:
    - job: dsp-tck-fetch
      artifacts: true
  tags:
    - saas-linux-medium-amd64
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: "$CI_COMMIT_TAG"
  script:
    - ls -la tools/e2e-testing/assets
    - wget -q https://download.oracle.com/java/21/latest/jdk-21_linux-x64_bin.deb
    - dpkg -i jdk-21_linux-x64_bin.deb > /dev/null
    - pnpm install --frozen-lockfile
    - pnpm build:libs
    - pnpm run --filter control-plane-api build
    - pnpm e2e:dsp-tck
