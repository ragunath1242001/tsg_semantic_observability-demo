.npm-package:
  extends:
    - .base-rules
    - .pnpm-cache-readonly
  stage: package
  rules:
    - if: '$RELEASE_NOW == "true"'
      when: never
    - if: $CI_COMMIT_TAG

cli-build:
  extends:
    - .base-rules
    - .pnpm-cache-readonly
  stage: build
  needs:
    - job: warm-cache
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH != "main"
      changes:
        - "tools/cli/**/*"
        - tools/tools.gitlab-ci.yml
        - .gitlab-ci.yml
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter cli build

cli-package:
  extends: .npm-package
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter cli build
    - pnpm --filter cli publish --no-git-checks

e2e-dsp-local:
  extends:
    - .base-rules
    - .pnpm-cache-readonly
  stage: test
  needs:
    - job: warm-cache
      optional: true
  tags:
    - saas-linux-medium-amd64
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - pnpm install --frozen-lockfile
    - pnpm build:libs
    - pnpm run --filter control-plane-api build
    - pnpm e2e:dsp-local

dsp-tck-fetch:
  image:
    name: eclipsedataspacetck/dsp-tck-runtime:1.0.0-RC4
    entrypoint:
      - "/bin/sh"
      - "-c"
  stage: build
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: "$CI_COMMIT_TAG"
  script:
    - echo "Fetching TCK test cases"
    - mkdir -p tools/e2e-testing/assets
    - cp /app/tck-runtime.jar tools/e2e-testing/assets/dsp-tck-runtime.jar
  artifacts:
    paths:
      - tools/e2e-testing/assets/dsp-tck-runtime.jar
    expire_in: 1 hour

e2e-dsp-tck:
  extends:
    - .base-rules
    - .pnpm-cache-readonly
  stage: test
  allow_failure: true
  variables:
    DISABLE_TCK_FETCH: "true"
  needs:
    - job: dsp-tck-fetch
      artifacts: true
  tags:
    - saas-linux-medium-amd64
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: "$CI_COMMIT_TAG"
  script:
    - ls -la tools/e2e-testing/assets
    - wget -q https://download.oracle.com/java/21/latest/jdk-21_linux-x64_bin.deb
    - dpkg -i jdk-21_linux-x64_bin.deb > /dev/null
    - pnpm install --frozen-lockfile
    - pnpm build:libs
    - pnpm run --filter control-plane-api build
    - pnpm e2e:dsp-tck
