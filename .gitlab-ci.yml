stages:
  - build
  - test
  - package
  - release

variables:
  RULES_CHANGES_PATH: "**/*"

.base-rules:
  image: node:22
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest-9 --activate
    - pnpm config set store-dir .pnpm-store
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store

release:
  extends:
    - .base-rules
  stage: release
  needs: []
  variables:
    GIT_EMAIL: semantic-release-bot@dataspac.es
    GIT_NAME: semantic-release
    TITLE: TNO Security Gateway
  script:
    - pnpm install --frozen-lockfile
    - node release/release.js
  rules:
    - if: '$RELEASE_NOW == "true" && $CI_COMMIT_BRANCH == "main"'

include:
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml
  - local: apps/apps.gitlab-ci.yml
  - local: libs/libs.gitlab-ci.yml
  - local: tools/tools.gitlab-ci.yml
  - local: helm-charts/helm.gitlab-ci.yml

container_scanning:
  parallel:
    matrix:
      - CS_IMAGE: "${CI_REGISTRY_IMAGE}/wallet:${CI_COMMIT_REF_SLUG}"
      - CS_IMAGE: "${CI_REGISTRY_IMAGE}/control-plane:${CI_COMMIT_REF_SLUG}"
      - CS_IMAGE: "${CI_REGISTRY_IMAGE}/http-data-plane:${CI_COMMIT_REF_SLUG}"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
