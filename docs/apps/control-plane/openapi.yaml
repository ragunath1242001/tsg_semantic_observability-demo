openapi: 3.0.0
paths:
  /api/settings:
    get:
      operationId: ConfigController_getSettings
      summary: Retrieve settings
      description: Retrieves the settings of the control plane.
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeConfigDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: &a1
        - Settings
      security: &a2
        - oauth2:
            - controlplane_admin
  /api/settings/update:
    post:
      operationId: ConfigController_updateSettings
      summary: Update settings
      description: Updates runtime settings for the control plane.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeConfigDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeConfigDto"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: *a1
      security: *a2
  /health:
    get:
      operationId: HealthController_getHealth
      summary: Health check
      description: Retrieves the current health of the control plane. If the control
        plane is running it always returns an empty 200 OK
      parameters: []
      responses:
        "200":
          description: ""
        "502":
          description: ""
      tags:
        - Health
  /api/auth/user:
    get:
      operationId: AuthController_getUser
      summary: Retrieve current user status
      description: Retrieves current user state, whether someone is logged in or not a
        200 result is provided. This is used in the frontend to determine
        whether certain aspects should be shown.
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticatedUserDto"
                  - $ref: "#/components/schemas/UnauthenticatedUserDto"
      tags: &a3
        - Authentication
  /api/auth/login:
    get:
      operationId: AuthController_login
      summary: Login redirect
      description: Redirects user to the correct authorization server
      parameters: []
      responses:
        "200":
          description: ""
      tags: *a3
  /api/auth/logout:
    get:
      operationId: AuthController_logout
      summary: Logout redirect
      description: Removes session information and redirects user the root of the
        frontend (`auth.redirectURL`)
      parameters: []
      responses:
        "302":
          description: ""
      tags: *a3
  /api/auth/callback:
    get:
      operationId: AuthController_callback
      summary: Login callback
      description: Users are redirected from the authorization server to this endpoint
        which will redirect them to the frontend (`auth.redirectURL`)
      parameters: []
      responses:
        "302":
          description: ""
      tags: *a3
  /api/data-plane/init:
    post:
      operationId: DataPlaneController_init
      summary: Initialize data plane
      description: Initializes a new data plane with the provided details.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataPlaneCreationDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataPlaneDto"
        "400":
          description: Invalid data plane details provided
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: &a4
        - Data Plane
      security: &a5
        - oauth2:
            - controlplane_admin
            - controlplane_dataplane
  /api/data-plane/{id}/update:
    post:
      operationId: DataPlaneController_update
      summary: Update data plane
      description: Updates the details of an existing data plane.
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataPlaneDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataPlaneDto"
        "400":
          description: Identifier mismatch or invalid data
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: *a4
      security: *a5
  /api/data-plane/{id}/catalog:
    post:
      operationId: DataPlaneController_updateCatalog
      summary: Update catalog
      description: Updates the catalog for the specified data plane.
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogSchema"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogSchema"
        "400":
          description: Invalid catalog data
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: *a4
      security: *a5
  /api/management/dataplanes:
    get:
      operationId: DataplaneManagementController_getDataPlanes
      summary: Get all dataplanes
      description: Fetches all the dataplanes.
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DataPlaneDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: &a6
        - Data Plane Management
      security: &a7
        - oauth2:
            - controlplane_admin
            - controlplane_dataplane
    post:
      operationId: DataplaneManagementController_addDataplane
      summary: Add a dataplane
      description: Adds a new dataplane.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataPlaneDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataPlaneDto"
        "400":
          description: Invalid dataplane data
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: *a6
      security: *a7
  /api/management/dataplanes/{id}:
    put:
      operationId: DataplaneManagementController_updateDataplane
      summary: Update a dataplane
      description: Updates an existing dataplane.
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataPlaneDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataPlaneDto"
        "400":
          description: Invalid dataplane data
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: *a6
      security: *a7
    delete:
      operationId: DataplaneManagementController_deleteDataPlane
      summary: Delete a dataplane
      description: Deletes a dataplane by ID.
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "202":
          description: Dataplane deleted successfully
        "400":
          description: Invalid dataplane ID
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: *a6
      security: *a7
  /api/catalog/request:
    post:
      operationId: CatalogController_request
      summary: Request catalog
      description: Requests a catalog with the provided details.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogRequestMessageSchema"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogSchema"
        "400":
          description: Invalid catalog request data
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: &a8
        - Catalog
      security: &a9
        - bearer: []
  /api/catalog/datasets/{id}:
    get:
      operationId: CatalogController_getDataset
      summary: Get dataset
      description: Fetches a dataset by ID.
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetSchema"
        "400":
          description: Invalid dataset ID
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: *a8
      security: *a9
  /api/management/catalog/request:
    get:
      operationId: CatalogManagementController_requestCatalog
      summary: Request catalog
      description: Requests a catalog from a remote or local connector.
      parameters:
        - name: address
          required: false
          in: query
          description: The address of the remote connector
          schema:
            type: string
        - name: audience
          required: false
          in: query
          description: The audience for the request
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogSchema"
        "400":
          description: Invalid request parameters
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: &a10
        - Catalog Management
      security: &a11
        - bearer: []
  /api/management/catalog/dataset:
    get:
      operationId: CatalogManagementController_requestDataset
      summary: Request dataset
      description: Requests a dataset from a remote or local connector by ID.
      parameters:
        - name: address
          required: false
          in: query
          description: The address of the remote connector
          schema:
            type: string
        - name: id
          required: true
          in: query
          description: The ID of the dataset
          schema:
            type: string
        - name: audience
          required: false
          in: query
          description: The audience for the request
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetSchema"
        "400":
          description: Invalid request parameters
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: *a10
      security: *a11
    post:
      operationId: CatalogManagementController_addDataset
      summary: Add dataset
      description: Adds a new dataset to the catalog.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatasetSchema"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetSchema"
        "400":
          description: Invalid dataset data
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: *a10
      security: *a11
  /api/management/catalog/dataset/{id}:
    put:
      operationId: CatalogManagementController_updateDataset
      summary: Update dataset
      description: Updates an existing dataset in the catalog.
      parameters:
        - name: id
          required: true
          in: path
          description: The ID of the dataset to update
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatasetSchema"
      responses:
        "202":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetSchema"
        "400":
          description: Invalid dataset data
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: *a10
      security: *a11
    delete:
      operationId: CatalogManagementController_deleteDataset
      summary: Delete dataset
      description: Deletes a dataset from the catalog by ID.
      parameters:
        - name: id
          required: true
          in: path
          description: The ID of the dataset to delete
          schema:
            type: string
      responses:
        "204":
          description: Dataset deleted successfully
        "400":
          description: Invalid dataset ID
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: *a10
      security: *a11
  /api/negotiations/request:
    post:
      operationId: NegotiationController_request
      summary: Request a new negotiation
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractRequestMessageSchema"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractNegotiationSchema"
      tags: &a12
        - Negotiations
      security: &a13
        - bearer: []
  /api/negotiations/{id}:
    get:
      operationId: NegotiationController_getNegotiation
      summary: Get negotiation status by ID
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractNegotiationSchema"
      tags: *a12
      security: *a13
  /api/negotiations/{id}/request:
    post:
      operationId: NegotiationController_requestWithId
      summary: Request negotiation with ID
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractRequestMessageSchema"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractNegotiationSchema"
      tags: *a12
      security: *a13
  /api/negotiations/{id}/events:
    post:
      operationId: NegotiationController_negotiationEvent
      summary: Handle negotiation event
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractNegotiationEventMessageSchema"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                example:
                  status: string
      tags: *a12
      security: *a13
  /api/negotiations/{id}/agreement/verification:
    post:
      operationId: NegotiationController_agreementVerification
      summary: Verify agreement
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractAgreementVerificationMessageSchema"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                example:
                  status: string
      tags: *a12
      security: *a13
  /api/negotiations/{id}/termination:
    post:
      operationId: NegotiationController_negotiationTermination
      summary: Terminate negotiation
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractNegotiationTerminationMessageSchema"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                example:
                  status: string
      tags: *a12
      security: *a13
  /api/negotiations/callbacks/{id}/offer:
    post:
      operationId: NegotiationController_callbackOffer
      summary: Handle negotiation callback offer
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractOfferMessageSchema"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                example:
                  status: string
      tags: *a12
      security: *a13
  /api/negotiations/callbacks/{id}/agreement:
    post:
      operationId: NegotiationController_callbackAgreement
      summary: Handle negotiation callback agreement
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractAgreementMessageSchema"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                example:
                  status: string
      tags: *a12
      security: *a13
  /api/negotiations/callbacks/{id}/events:
    post:
      operationId: NegotiationController_callbackEvent
      summary: Handle negotiation callback event
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractNegotiationEventMessageSchema"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                example:
                  status: string
      tags: *a12
      security: *a13
  /api/management/negotiations:
    get:
      operationId: NegotiationManagementController_getNegotiations
      summary: Get all negotiations
      parameters: []
      responses:
        "200":
          description: Successfully fetched negotiations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NegotiationStatusDto"
      tags: &a14
        - Negotiations Management
      security: &a15
        - oauth2:
            - controlplane_admin
            - controlplane_dataplane
  /api/management/negotiations/{processId}:
    get:
      operationId: NegotiationManagementController_getNegotiation
      summary: Get a negotiation by process ID
      parameters:
        - name: processId
          required: true
          in: path
          description: Process ID of the negotiation
          schema:
            type: string
      responses:
        "200":
          description: Successfully fetched negotiation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NegotiationDetailSchema"
      tags: *a14
      security: *a15
  /api/management/negotiations/request:
    post:
      operationId: NegotiationManagementController_requestNewNegotiation
      summary: Request a new negotiation
      parameters:
        - name: dataSet
          required: true
          in: query
          description: Dataset for the negotiation
          schema:
            type: string
        - name: address
          required: true
          in: query
          description: Address for the negotiation
          schema:
            type: string
        - name: audience
          required: true
          in: query
          description: Audience for the negotiation
          schema:
            type: string
      requestBody:
        required: true
        description: Offer details
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferSchema"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractNegotiationSchema"
      tags: *a14
      security: *a15
  /api/management/negotiations/{processId}/request:
    post:
      operationId: NegotiationManagementController_requestExistingNegotiation
      summary: Request an existing negotiation
      parameters:
        - name: processId
          required: true
          in: path
          description: Process ID of the negotiation
          schema:
            type: string
      requestBody:
        required: true
        description: Offer details
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferSchema"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractNegotiationSchema"
      tags: *a14
      security: *a15
  /api/management/negotiations/{processId}/offer:
    post:
      operationId: NegotiationManagementController_offer
      summary: Submit an offer for an existing negotiation
      parameters:
        - name: processId
          required: true
          in: path
          description: Process ID of the negotiation
          schema:
            type: string
        - name: address
          required: false
          in: query
          description: Address for the negotiation
          schema:
            type: string
      requestBody:
        required: true
        description: Offer details
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferSchema"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                example:
                  status: string
      tags: *a14
      security: *a15
  /api/management/negotiations/{processId}/agreement:
    post:
      operationId: NegotiationManagementController_agree
      summary: Agree to a negotiation
      parameters:
        - name: processId
          required: true
          in: path
          description: Process ID of the negotiation
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                example:
                  status: string
      tags: *a14
      security: *a15
  /api/management/negotiations/{processId}/verify:
    post:
      operationId: NegotiationManagementController_verify
      summary: Verify a negotiation agreement
      parameters:
        - name: processId
          required: true
          in: path
          description: Process ID of the negotiation
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                example:
                  status: string
      tags: *a14
      security: *a15
  /api/management/negotiations/{processId}/finalize:
    post:
      operationId: NegotiationManagementController_finalize
      summary: Finalize a negotiation
      parameters:
        - name: processId
          required: true
          in: path
          description: Process ID of the negotiation
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                example:
                  status: string
      tags: *a14
      security: *a15
  /api/management/negotiations/{processId}/terminate:
    post:
      operationId: NegotiationManagementController_terminate
      summary: Terminate a negotiation
      parameters:
        - name: processId
          required: true
          in: path
          description: Process ID of the negotiation
          schema:
            type: string
      requestBody:
        required: true
        description: Termination details
        content:
          application/json:
            schema:
              example:
                code: string
                reason: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                example:
                  status: string
      tags: *a14
      security: *a15
  /api/management/agreements/{agreementId}:
    get:
      operationId: AgreementManagementController_getAgreement
      summary: Get an agreement by agreement ID
      parameters:
        - name: agreementId
          required: true
          in: path
          description: Agreement ID
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractAgreementMessageSchema"
      tags:
        - Agreement
      security:
        - oauth2:
            - controlplane_admin
  /api/management/policy/evaluation/{transferId}/lastContext:
    get:
      operationId: PolicyEvaluationController_getLastContext
      summary: Retrieve last evaluation context
      description: Retrieve last evaluation context of the specified transfer ID.
      parameters:
        - name: transferId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationContext"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
