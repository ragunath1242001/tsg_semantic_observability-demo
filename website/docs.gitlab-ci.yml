image: node:24
pages:
  tags:
    - saas-linux-large-amd64
  stage: release
  needs: []
  script:
    - cd website/
    - npm ci
    - npm run docusaurus clean-api-docs all
    - npm run docusaurus gen-api-docs all
    - npm run build:gitlab
    - mv public ../public
  artifacts:
    paths:
      - public
  rules:
    - if: '$RELEASE_NOW == "true"'
      when: never
    - if: '$RENOVATE_CHECK == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: "$CI_COMMIT_TAG"
website-build:
  tags:
    - saas-linux-large-amd64
  stage: package
  needs: []
  script:
    - cd website/
    - npm ci
    - npm run docusaurus clean-api-docs all
    - npm run docusaurus gen-api-docs all
    # Build only for current version to save time in CI
    - npm run build:gitlab -- --config docusaurus.validate.config.ts
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "website/**/*"
