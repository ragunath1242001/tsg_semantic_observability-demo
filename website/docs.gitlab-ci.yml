image: node:22
pages:
  stage: build
  script:
    - cd website/
    # TODO workaround for: https://github.com/postmanlabs/postman-code-generators/issues/772
    - mv /usr/local/bin/yarn /usr/local/bin/yarn.bak
    - npm install
    - npm run docusaurus clean-api-docs all
    - npm run docusaurus gen-api-docs all
    - npm run build:gitlab
    - mv public ../public
  artifacts:
    paths:
      - public
  rules:
    - if: '$RELEASE_NOW == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: "$CI_COMMIT_TAG"
