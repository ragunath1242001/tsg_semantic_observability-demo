info:
  title: TSG Control Plane
  description: "This OpenAPI specification shows the endpoints of the Control
    Plane. Most of the endpoints are related to the Dataspace Protocol, as
    specified by the Eclipse Working Group Dataspaces. Other endpoints are
    supportive endpoints to make sure the data can be added to the catalog, and
    to make sure that UI interactions can take place.  __*Note*__: This OpenAPI
    definition is not intended to be directly linked with a single Control Plane
    instance. "
  version: ""
  contact: {}
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
tags:
  - name: Health
    description: Health Controller
  - name: Settings
    description: Settings Controller
  - name: Authentication
    description: Authentication Controller
  - name: Data Plane
    description: Data Plane Management Controller
  - name: Data Plane Management
    description: Data Plane Management Controller
  - name: Catalog
    description: Catalog Controller
  - name: Catalog Management
    description: Catalog Management Controller
  - name: Negotiations
    description: Negotiations Controller
  - name: Negotiations Management
    description: Negotiations Management Controller
  - name: Transfers
    description: Transfers Controller
  - name: Transfers Management
    description: Transfers Management Controller
  - name: Registry
    description: Registry Controller
  - name: Registry Management
    description: Registry Management Controller
servers: []
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        password:
          scopes:
            controlplane_admin: controlplane_admin
            controlplane_dataplane: controlplane_dataplane
    bearer:
      scheme: bearer
      bearerFormat: VP
      type: http
      description: Verifiable Presentation needed to communicate between two instances
        of the control plane.
  schemas:
    RuntimeConfigDto:
      type: object
      properties:
        controlPlaneInteractions:
          type: string
        color:
          type: string
        darkThemeUrl:
          type: string
        lightThemeUrl:
          type: string
      required:
        - controlPlaneInteractions
        - color
    ErrorDto:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
        code:
          type: number
        message:
          type: object
        error:
          type: string
      required:
        - name
        - status
        - code
    DatabaseStatusDto:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MemoryUsageDto:
      type: object
      properties:
        does_zap_garbage:
          type: number
        external_memory:
          type: number
        heap_size_limit:
          type: number
        malloced_memory:
          type: number
        number_of_detached_contexts:
          type: number
        number_of_native_contexts:
          type: number
        peak_malloced_memory:
          type: number
        total_available_size:
          type: number
        total_global_handles_size:
          type: number
        total_heap_size:
          type: number
        total_heap_size_executable:
          type: number
        total_physical_size:
          type: number
        used_global_handles_size:
          type: number
        used_heap_size:
          type: number
      required:
        - does_zap_garbage
        - external_memory
        - heap_size_limit
        - malloced_memory
        - number_of_detached_contexts
        - number_of_native_contexts
        - peak_malloced_memory
        - total_available_size
        - total_global_handles_size
        - total_heap_size
        - total_heap_size_executable
        - total_physical_size
        - used_global_handles_size
        - used_heap_size
    NegotiationStatusDto:
      type: object
      properties:
        localId:
          type: string
        remoteId:
          type: string
        remoteParty:
          type: string
        role:
          type: string
          enum: &a32
            - provider
            - consumer
        remoteAddress:
          type: string
        state:
          type: string
          enum: &a33
            - dspace:REQUESTED
            - dspace:OFFERED
            - dspace:ACCEPTED
            - dspace:AGREED
            - dspace:VERIFIED
            - dspace:FINALIZED
            - dspace:TERMINATED
        dataSet:
          type: string
        modifiedDate:
          format: date-time
          type: string
      required:
        - localId
        - remoteId
        - remoteParty
        - role
        - remoteAddress
        - state
        - dataSet
        - modifiedDate
    TransferStatusDto:
      type: object
      properties:
        localId:
          type: string
        remoteId:
          type: string
        role:
          type: string
        remoteAddress:
          type: string
        remoteParty:
          type: string
        state:
          type: string
          enum: &a34
            - dspace:REQUESTED
            - dspace:STARTED
            - dspace:TERMINATED
            - dspace:COMPLETED
            - dspace:SUSPENDED
        process:
          $ref: "#/components/schemas/TransferProcessSchema"
        agreementId:
          type: string
        format:
          type: string
        modifiedDate:
          format: date-time
          type: string
      required:
        - localId
        - role
        - remoteAddress
        - remoteParty
        - state
        - process
        - agreementId
        - modifiedDate
    StatusDto:
      type: object
      properties:
        database:
          $ref: "#/components/schemas/DatabaseStatusDto"
        memoryUsage:
          $ref: "#/components/schemas/MemoryUsageDto"
        uptime:
          type: number
        negotiations:
          $ref: "#/components/schemas/NegotiationStatusDto"
        transfers:
          $ref: "#/components/schemas/TransferStatusDto"
      required:
        - database
        - memoryUsage
        - uptime
        - negotiations
        - transfers
    ClientInfo:
      type: object
      properties:
        sub:
          type: string
        name:
          type: string
        email:
          type: string
        didId:
          type: string
        roles:
          type: array
          items:
            type: string
        refreshToken:
          type: string
      required:
        - sub
        - name
        - email
        - roles
    AuthenticatedUser:
      type: object
      properties:
        state:
          type: string
        user:
          $ref: "#/components/schemas/ClientInfo"
      required:
        - state
        - user
    UnauthenticatedUser:
      type: object
      properties:
        state:
          type: string
      required:
        - state
    ConstraintSchema:
      type: object
      properties:
        "@type":
          type: string
        odrl:leftOperand:
          type: string
        odrl:operator:
          type: string
        odrl:rightOperand:
          type: object
        odrl:rightOperandReference:
          type: string
      required:
        - "@type"
        - odrl:leftOperand
        - odrl:operator
    PermissionSchema:
      type: object
      properties:
        "@type":
          type: string
        odrl:assigner:
          type: string
        odrl:assignee:
          type: string
        odrl:action:
          type: string
        odrl:target:
          type: string
        odrl:constraint:
          type: array
          items:
            $ref: "#/components/schemas/ConstraintSchema"
        odrl:Duty:
          type: array
          items:
            type: string
      required:
        - "@type"
        - odrl:action
    ProhibitionSchema:
      type: object
      properties:
        "@type":
          type: string
        odrl:assigner:
          type: string
        odrl:assignee:
          type: string
        odrl:action:
          type: string
        odrl:target:
          type: string
        odrl:constraint:
          type: array
          items:
            $ref: "#/components/schemas/ConstraintSchema"
      required:
        - "@type"
        - odrl:action
    Duty:
      type: object
      properties: {}
    PolicySchema:
      type: object
      properties:
        "@id":
          type: string
        "@type":
          type: string
        odrl:assigner:
          type: string
        odrl:assignee:
          type: string
        odrl:profile:
          type: string
        odrl:permission:
          type: array
          items:
            $ref: "#/components/schemas/PermissionSchema"
        odrl:prohibition:
          type: array
          items:
            $ref: "#/components/schemas/ProhibitionSchema"
        odrl:obligation:
          type: array
          items:
            $ref: "#/components/schemas/Duty"
        odrl:target:
          type: string
