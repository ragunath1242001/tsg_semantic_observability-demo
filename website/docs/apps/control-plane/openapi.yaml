openapi: 3.0.0
paths:
  /.well-known/dspace-version:
    get:
      description: Returns the protocol version of the control plane.
      operationId: VersionsController_getVersions
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionSchema"
      summary: Retrieve the protocol version metadata
      tags:
        - Versions
  /api/settings:
    get:
      description: Retrieves the settings of the control plane.
      operationId: ConfigController_getSettings
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeConfigDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security: &a1
        - oauth2:
            - controlplane_admin
      summary: Retrieve settings
      tags: &a2
        - Settings
  /api/settings/update:
    post:
      description: Updates runtime settings for the control plane.
      operationId: ConfigController_updateSettings
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeConfigDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeConfigDto"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security: *a1
      summary: Update settings
      tags: *a2
  /api/settings/upload:
    post:
      description: Uploads logo for the control plane, receive a base64 encoded url.
      operationId: ConfigController_uploadFile
      parameters: []
      responses:
        "200":
          description: ""
      security: *a1
      summary: Upload logo
      tags: *a2
  /health:
    get:
      description: Retrieves the current health of the app. If the app is running and
        it is connected to the database it always returns an empty 200 OK
      operationId: HealthController_getHealth
      parameters: []
      responses:
        "200":
          description: ""
        "502":
          description: ""
        "503":
          description: The Health Check is not successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  info:
                    type: object
                    example:
                      database: &a3
                        status: up
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  error:
                    type: object
                    example:
                      redis: &a4
                        status: down
                        message: Could not connect
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  details:
                    type: object
                    example:
                      database: *a3
                      redis: *a4
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
      summary: Health check
      tags:
        - Health
  /api/status:
    get:
      description: Retrieves the current health of the control plane. With additional
        status information
      operationId: StatusController_getStatus
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusDto"
      responses:
        "200":
          description: ""
        "502":
          description: ""
      summary: Application status
      tags:
        - Status
  /api/auth/user:
    get:
      description: Retrieves current user state, whether someone is logged in or not a
        200 result is provided. This is used in the frontend to determine
        whether certain aspects should be shown.
      operationId: AuthController_getUser
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticatedUser"
                  - $ref: "#/components/schemas/UnauthenticatedUser"
      summary: Retrieve current user status
      tags: &a5
        - Authentication
  /api/auth/login:
    get:
      description: Redirects user to the correct authorization server
      operationId: AuthController_login
      parameters: []
      responses:
        "302":
          description: ""
      summary: Login redirect
      tags: *a5
  /api/auth/logout:
    get:
      description: Removes session information and redirects user the root of the
        frontend (`auth.redirectURL`)
      operationId: AuthController_logout
      parameters: []
      responses:
        "302":
          description: ""
      summary: Logout redirect
      tags: *a5
  /api/auth/callback:
    get:
      description: Users are redirected from the authorization server to this endpoint
        which will redirect them to the frontend (`auth.redirectURL`)
      operationId: AuthController_callback
      parameters:
        - name: state
          required: false
          in: query
          description: The state parameter
          schema:
            example: randomState
            type: string
        - name: code
          required: false
          in: query
          description: The authorization code
          schema:
            example: code
            type: string
        - name: access_token
          required: false
          in: query
          description: The access token
          schema:
            type: string
        - name: token_type
          required: false
          in: query
          description: The token type
          schema:
            example: Bearer
            type: string
        - name: expires_in
          required: false
          in: query
          description: The token expiration in seconds
          schema:
            example: 3600
            type: string
        - name: id_token
          required: false
          in: query
          description: The ID token
          schema:
            type: string
        - name: code_verifier
          required: false
          in: query
          description: The code verifier
          schema:
            example: randomChallengeVerifier
            type: string
      responses:
        "302":
          description: ""
      summary: Login callback
      tags: *a5
  /api/data-plane/init:
    post:
      description: Initializes a new data plane with the provided details.
      operationId: DataPlaneController_init
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataPlaneCreation"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataPlaneDetailsDto"
        "400":
          description: Invalid data plane details provided
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security: &a6
        - oauth2:
            - controlplane_admin
            - controlplane_dataplane
      summary: Initialize data plane
      tags: &a7
        - Data Plane
  /api/data-plane/{id}/update:
    post:
      description: Updates the details of an existing data plane.
      operationId: DataPlaneController_update
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataPlaneDetailsDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataPlaneDetailsDto"
        "400":
          description: Identifier mismatch or invalid data
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security: *a6
      summary: Update data plane
      tags: *a7
  /api/data-plane/{id}/catalog:
    post:
      description: Updates the catalog for the specified data plane.
      operationId: DataPlaneController_updateCatalog
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogSchema"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogSchema"
        "400":
          description: Invalid catalog data
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security: *a6
      summary: Update catalog
      tags: *a7
  /api/data-plane/{id}/dataset:
    post:
      description: Adds a new dataset to the specified data plane.
      operationId: DataPlaneController_addDataset
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        description: Dataset details
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatasetSchema"
      responses:
        "200":
          description: Dataset added successfully
        "400":
          description: Invalid dataset details provided
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security: *a6
      summary: Add dataset
      tags: *a7
  /api/data-plane/{id}/dataset/{datasetId}:
    put:
      description: Updates an existing dataset for the specified data plane.
      operationId: DataPlaneController_updateDataset
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: datasetId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        description: Updated dataset details
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatasetSchema"
      responses:
        "200":
          description: Dataset updated successfully
        "400":
          description: Identifier mismatch or invalid dataset data
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security: *a6
      summary: Update dataset
      tags: *a7
    delete:
      description: Deletes a dataset from the specified data plane.
      operationId: DataPlaneController_deleteDataset
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: datasetId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: Dataset deleted successfully
        "400":
          description: Invalid dataset identifier
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security: *a6
      summary: Delete dataset
      tags: *a7
  /api/management/dataplanes:
    get:
      description: Fetches all the dataplanes.
      operationId: DataplaneManagementController_getDataPlanes
      parameters:
        - name: order
          required: false
          in: query
          schema:
            default: DESC
            type: string
            enum:
              - ASC
              - DESC
        - name: order_by
          required: false
          in: query
          schema:
            default: modifiedDate
            type: string
        - name: page
          required: false
          in: query
          schema:
            minimum: 1
            default: 1
            type: number
        - name: per_page
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 100
            type: number
      responses:
        "200":
          description: ""
          headers:
            x-page:
              description: Index of the current page (starting at 1)
              schema:
                type: integer
            x-prev-page:
              description: Index of the previous page
              schema:
                type: integer
              required: false
            x-next-page:
              description: Index of the next page
              schema:
                type: integer
              required: false
            x-per-page:
              description: Number of items per page
              schema:
                type: integer
            x-total-pages:
              description: Total number of pages
              schema:
                type: integer
            x-total:
              description: Total number of items
              schema:
                type: integer
            link:
              description: Web Linking to other pages of this resource
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DataPlaneDetailsDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security: &a8
        - oauth2:
            - controlplane_admin
            - controlplane_dataplane
      summary: Get all dataplanes
      tags: &a9
        - Data Plane Management
    post:
      description: Adds a new dataplane.
      operationId: DataplaneManagementController_addDataplane
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataPlaneDetailsDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataPlaneDetailsDto"
        "400":
          description: Invalid dataplane data
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security: *a8
      summary: Add a dataplane
      tags: *a9
  /api/management/dataplanes/{id}:
    put:
      description: Updates an existing dataplane.
      operationId: DataplaneManagementController_updateDataplane
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataPlaneDetailsDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataPlaneDetailsDto"
        "400":
          description: Invalid dataplane data
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security: *a8
      summary: Update a dataplane
      tags: *a9
    delete:
      description: Deletes a dataplane by ID.
      operationId: DataplaneManagementController_deleteDataPlane
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "202":
          description: Dataplane deleted successfully
        "400":
          description: Invalid dataplane ID
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security: *a8
      summary: Delete a dataplane
      tags: *a9
  /api/catalog/request:
    post:
      description: Requests a catalog with the provided details.
      operationId: CatalogController_request
      parameters:
        - name: order
          required: false
          in: query
          schema:
            default: DESC
            type: string
            enum:
              - ASC
              - DESC
        - name: order_by
          required: false
          in: query
          schema:
            default: modifiedDate
            type: string
        - name: page
          required: false
          in: query
          schema:
            minimum: 1
            default: 1
            type: number
        - name: per_page
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 100
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogRequestMessageSchema"
      responses:
        "200":
          description: ""
          headers:
            x-page:
              description: Index of the current page (starting at 1)
              schema:
                type: integer
            x-prev-page:
              description: Index of the previous page
              schema:
                type: integer
              required: false
            x-next-page:
              description: Index of the next page
              schema:
                type: integer
              required: false
            x-per-page:
              description: Number of items per page
              schema:
                type: integer
            x-total-pages:
              description: Total number of pages
              schema:
                type: integer
            x-total:
              description: Total number of items
              schema:
                type: integer
            link:
              description: Web Linking to other pages of this resource
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogSchema"
        "400":
          description: Invalid catalog request data
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security: &a10
        - bearer: []
      summary: Request catalog
      tags: &a11
        - Catalog
  /api/catalog/datasets/{id}:
    get:
      description: Fetches a dataset by ID.
      operationId: CatalogController_getDataset
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetSchema"
        "400":
          description: Invalid dataset ID
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security: *a10
      summary: Get dataset
      tags: *a11
  /api/management/catalog/request:
    get:
      description: Requests a catalog from a remote or local connector.
      operationId: CatalogManagementController_requestCatalog
      parameters:
        - name: order
          required: false
          in: query
          schema:
            default: DESC
            type: string
            enum:
              - ASC
              - DESC
        - name: order_by
          required: false
          in: query
          schema:
            default: modifiedDate
            type: string
        - name: page
          required: false
          in: query
          schema:
            minimum: 1
            default: 1
            type: number
        - name: per_page
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 100
            type: number
        - name: address
          required: false
          in: query
          description: The address of the remote connector
          schema:
            type: string
        - name: audience
          required: false
          in: query
          description: The audience for the request
          schema:
            type: string
      responses:
        "200":
          description: ""
          headers:
            x-page:
              description: Index of the current page (starting at 1)
              schema:
                type: integer
            x-prev-page:
              description: Index of the previous page
              schema:
                type: integer
              required: false
            x-next-page:
              description: Index of the next page
              schema:
                type: integer
              required: false
            x-per-page:
              description: Number of items per page
              schema:
                type: integer
            x-total-pages:
              description: Total number of pages
              schema:
                type: integer
            x-total:
              description: Total number of items
              schema:
                type: integer
            link:
              description: Web Linking to other pages of this resource
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogSchema"
        "400":
          description: Invalid request parameters
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security: &a12
        - bearer: []
      summary: Request catalog
      tags: &a13
        - Catalog Management
  /api/management/catalog/dataset:
    get:
      description: Requests a dataset from a remote or local connector by ID.
      operationId: CatalogManagementController_requestDataset
      parameters:
        - name: id
          required: true
          in: query
          description: The ID of the dataset
          schema:
            type: string
        - name: address
          required: false
          in: query
          description: The address of the remote connector
          schema:
            type: string
        - name: audience
          required: false
          in: query
          description: The audience for the request
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetSchema"
        "400":
          description: Invalid request parameters
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security: *a12
      summary: Request dataset
      tags: *a13
    post:
      description: Adds a new dataset to the catalog.
      operationId: CatalogManagementController_addDataset
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatasetSchema"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetSchema"
        "400":
          description: Invalid dataset data
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security: *a12
      summary: Add dataset
      tags: *a13
  /api/management/catalog/dataset/{id}:
    put:
      description: Updates an existing dataset in the catalog.
      operationId: CatalogManagementController_updateDataset
      parameters:
        - name: id
          required: true
          in: path
          description: The ID of the dataset to update
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatasetSchema"
      responses:
        "202":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetSchema"
        "400":
          description: Invalid dataset data
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security: *a12
      summary: Update dataset
      tags: *a13
    delete:
      description: Deletes a dataset from the catalog by ID.
      operationId: CatalogManagementController_deleteDataset
      parameters:
        - name: id
          required: true
          in: path
          description: The ID of the dataset to delete
          schema:
            type: string
      responses:
        "204":
          description: Dataset deleted successfully
        "400":
          description: Invalid dataset ID
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security: *a12
      summary: Delete dataset
      tags: *a13
  /api/negotiations/request:
    post:
      operationId: NegotiationController_request
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractRequestMessageSchema"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractNegotiationSchema"
      security: &a14
        - bearer: []
      summary: Request a new negotiation
      tags: &a15
        - Negotiations
  /api/negotiations/{id}:
    get:
      operationId: NegotiationController_getNegotiation
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractNegotiationSchema"
      security: *a14
      summary: Get negotiation status by ID
      tags: *a15
  /api/negotiations/{id}/request:
    post:
      operationId: NegotiationController_requestWithId
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractRequestMessageSchema"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractNegotiationSchema"
      security: *a14
      summary: Request negotiation with ID
      tags: *a15
  /api/negotiations/{id}/events:
    post:
      operationId: NegotiationController_negotiationEvent
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractNegotiationEventMessageSchema"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                example:
                  status: string
      security: *a14
      summary: Handle negotiation event
      tags: *a15
  /api/negotiations/{id}/agreement/verification:
    post:
      operationId: NegotiationController_agreementVerification
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
