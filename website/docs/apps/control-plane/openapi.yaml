  /api/management/dataplanes:
    get:
      description: Fetches all the dataplanes.
      operationId: DataplaneManagementController_getDataPlanes
      parameters:
        - name: order
          required: false
          in: query
          schema:
            default: DESC
            enum:
              - ASC
              - DESC
            type: string
        - name: order_by
          required: false
          in: query
          schema:
            default: modifiedDate
            type: string
        - name: page
          required: false
          in: query
          schema:
            minimum: 1
            default: 1
            type: number
        - name: per_page
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 100
            type: number
      responses:
        "200":
          description: ""
          headers:
            x-page:
              description: Index of the current page (starting at 1)
              schema:
                type: integer
            x-prev-page:
              description: Index of the previous page
              schema:
                type: integer
              required: false
            x-next-page:
              description: Index of the next page
              schema:
                type: integer
              required: false
            x-per-page:
              description: Number of items per page
              schema:
                type: integer
            x-total-pages:
              description: Total number of pages
              schema:
                type: integer
            x-total:
              description: Total number of items
              schema:
                type: integer
            link:
              description: Web Linking to other pages of this resource
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DataPlaneDetailsDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security: &a8
        - oauth2:
            - controlplane_admin
            - controlplane_dataplane
      summary: Get all dataplanes
      tags: &a9
        - Data Plane Management
    post:
      description: Adds a new dataplane.
      operationId: DataplaneManagementController_addDataplane
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
