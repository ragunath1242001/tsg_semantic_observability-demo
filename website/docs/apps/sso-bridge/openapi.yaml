openapi: 3.0.0
paths:
  /health:
    get:
      description: Retrieves the current health of the app. If the app is running and
        it is connected to the database it always returns an empty 200 OK
      operationId: HealthController_getHealth
      parameters: []
      responses:
        "200":
          description: ""
        "502":
          description: ""
        "503":
          description: The Health Check is not successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  info:
                    type: object
                    example:
                      database: &a1
                        status: up
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  error:
                    type: object
                    example:
                      redis: &a2
                        status: down
                        message: Could not connect
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  details:
                    type: object
                    example:
                      database: *a1
                      redis: *a2
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
      summary: Health check
      tags:
        - Health
  /api/auth/user:
    get:
      description: Get the current user and their roles and grants.
      operationId: AuthController_getUser
      parameters: []
      responses:
        "200":
          description: ""
      summary: Get user
      tags: &a3
        - Auth
  /api/auth/login:
    post:
      description: Login with username and password.
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  example: admin
                  type: string
                password:
                  example: hunter2
                  type: string
              required:
                - username
                - password
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    example: b86483f3-3792-4a54-b11e-f1c6face9935
                    type: string
                  username:
                    example: admin
                    type: string
                  email:
                    example: admin@example.com
                    type: string
                  roles:
                    type: array
                    items:
                      type: string
                  grants:
                    type: array
                    items:
                      type: string
      summary: Login
      tags: *a3
  /api/auth/logout:
    get:
      description: Logout the current user.
      operationId: AuthController_logout
      parameters: []
      responses:
        "200":
          description: ""
      summary: Logout
      tags: *a3
  /api/users:
    get:
      operationId: UsersController_getUsers
      parameters: []
      responses:
        "200":
          description: List of users returned.
      summary: Get all users
      tags: &a4
        - Users
  /api/users/create:
    post:
      operationId: UsersController_createUser
      parameters: []
      responses:
        "201":
          description: The user has been successfully created.
      summary: Create a new user
      tags: *a4
  /api/users/{id}:
    delete:
      operationId: UsersController_deleteUser
      parameters:
        - name: id
          required: true
          in: path
          description: User id
          schema:
            type: number
      responses:
        "200":
          description: User successfully deleted.
      summary: Delete a user
      tags: *a4
  /api/users/update/{id}:
    patch:
      operationId: UsersController_updateUser
      parameters:
        - name: id
          required: true
          in: path
          description: User id
          schema:
            type: number
      responses:
        "200":
          description: User successfully updated.
      summary: Update an existing user
      tags: *a4
  /api/oauth/authorize:
    get:
      description: Authorize a client and redirect to the client's redirect_uri.
      operationId: OauthController_authorize
      parameters:
        - name: response_type
          required: true
          in: query
          description: The response type of the authorization
          schema:
            example: code
            type: string
        - name: response_mode
          required: true
          in: query
          description: The response mode of the authorization
          schema:
            example: query
            type: string
            enum:
              - query
              - fragment
        - name: client_id
          required: true
          in: query
          description: The client identifier issuing the authorization request
          schema:
            example: client-id
            type: string
        - name: redirect_uri
          required: true
          in: query
          description: The URI to redirect to after authorization
          schema:
            example: https://example.com/redirect
            type: string
        - name: scope
          required: false
          in: query
          description: Optional scope
          schema:
            example: openid profile email
            type: string
        - name: state
          required: false
          in: query
          description: Optional state parameter
          schema:
            example: randomState
            type: string
        - name: nonce
          required: false
          in: query
          description: Optional nonce parameter
          schema:
            example: randomNonce
            type: string
        - name: code_challenge
          required: false
          in: query
          description: Optional challenge parameter
          schema:
            example: randomChallenge
            type: string
        - name: code_challenge_method
          required: false
          in: query
          description: Optional challenge method
          schema:
            example: S256
            type: string
            enum:
              - plain
              - S256
      responses:
        "200":
          description: ""
      summary: Authorize
      tags: &a5
        - Oauth
  /api/oauth/login:
    post:
      description: Login a user and redirect to the client's redirect_uri.
      operationId: OauthController_login
      parameters:
        - name: response_type
          required: true
          in: query
          description: The response type of the authorization
          schema:
            example: code
            type: string
        - name: response_mode
          required: true
          in: query
          description: The response mode of the authorization
          schema:
            example: query
            type: string
            enum:
              - query
              - fragment
        - name: client_id
          required: true
          in: query
          description: The client identifier issuing the authorization request
          schema:
            example: client-id
            type: string
        - name: redirect_uri
          required: true
          in: query
          description: The URI to redirect to after authorization
          schema:
            example: https://example.com/redirect
            type: string
        - name: scope
          required: false
          in: query
          description: Optional scope
          schema:
            example: openid profile email
            type: string
        - name: state
          required: false
          in: query
          description: Optional state parameter
          schema:
            example: randomState
            type: string
        - name: nonce
          required: false
          in: query
          description: Optional nonce parameter
          schema:
            example: randomNonce
            type: string
        - name: code_challenge
          required: false
          in: query
          description: Optional challenge parameter
          schema:
            example: randomChallenge
            type: string
        - name: code_challenge_method
          required: false
          in: query
          description: Optional challenge method
          schema:
            example: S256
            type: string
            enum:
              - plain
              - S256
        - name: redirect
          required: true
          in: query
          schema:
            type: boolean
      responses:
        "201":
          description: ""
      summary: Login
      tags: *a5
  /api/oauth/token:
    post:
      description: Get a token for the client.
      operationId: OauthController_token
      parameters: []
      responses:
        "200":
          description: ""
      summary: Token
      tags: *a5
  /api/oauth/userinfo:
    get:
      description: Get the userinfo for the token.
      operationId: OauthController_userinfoGet
      parameters:
        - name: token
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: Get Userinfo
      tags: *a5
    post:
      description: Get the userinfo for the token.
      operationId: OauthController_userinfoPost
      parameters: []
      responses:
        "200":
          description: ""
      summary: Get Userinfo
      tags: *a5
  /api/oauth/introspect:
    post:
      description: Introspect the token.
      operationId: OauthController_introspect
      parameters: []
      responses:
        "200":
          description: ""
      summary: Introspect
      tags: *a5
  /api/oauth/device_authorization:
    post:
      description: Device Authorization
      operationId: OauthController_deviceAuthorization
      parameters: []
      responses:
        "200":
          description: ""
      summary: Device Authorization
      tags: *a5
  /api/oauth/revocation:
    post:
      description: Revocation of the token.
      operationId: OauthController_revocation
      parameters: []
      responses:
        "200":
          description: ""
      summary: Revocation
      tags: *a5
  /api/oauth/jwks:
    get:
      description: Get the JWKS for the OAuth server
      operationId: OauthController_getJWKS
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JWKS"
        "502":
          description: ""
      summary: Get JWKS
      tags: *a5
  /api/.well-known/openid-configuration:
    get:
      description: Find all the open ID metadata for the OAuth server
      operationId: MetadataController_getOpenIDConfiguration
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenIDConfiguration"
        "502":
          description: ""
      summary: Open ID Configuration
      tags:
        - Well-known endpoint
  /api/clients:
    get:
      operationId: ClientsController_getClients
      parameters: []
      responses:
        "200":
          description: List of clients returned successfully.
      summary: Retrieve all clients
      tags: &a6
        - Clients
  /api/clients/create:
    post:
      operationId: ClientsController_createUser
      parameters: []
      requestBody:
        required: true
        description: Data for the new client
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientDto"
      responses:
        "201":
          description: Client created successfully.
      summary: Create a new client
      tags: *a6
  /api/clients/{id}:
    delete:
      operationId: ClientsController_deleteClient
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        "200":
          description: Client deleted successfully.
      summary: Delete a client by id
      tags: *a6
  /api/clients/update/{id}:
    patch:
      operationId: ClientsController_updateClient
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        description: Updated client data
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientDto"
      responses:
        "200":
          description: Client updated successfully.
      summary: Update an existing client
      tags: *a6
info:
  title: TSG SSO Bridge
  description: "TSG SSO Bridge API Documentation "
  version: ""
  contact: {}
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
tags:
  - name: Health
    description: Health controller
  - name: Auth
    description: Authentication controller
  - name: Users
    description: Users controller
  - name: Oauth
    description: Oauth controller
  - name: Clients
    description: Clients controller
servers: []
components:
  schemas:
    JsonWebKeyDto:
      type: object
      properties:
        alg:
          type: string
          example: RS256
        crv:
          type: string
          example: P-256
        e:
          type: string
          example: AQAB
        ext:
          type: boolean
          example: false
        key_ops:
          example:
            - sign
            - verify
          type: array
          items:
            type: string
        kid:
          type: string
          example: bdfd4c8e-3a44-4b9f-bc3e-1a8e26e3e99d
        kty:
          type: string
          example: RSA
        n:
          type: string
          example: sample_modulus
        use:
          type: string
          example: sig
        x:
          type: string
          example: sample_x_coordinate
        y:
          type: string
          example: sample_y_coordinate
      required:
        - kty
    JWKS:
      type: object
      properties:
        keys:
          description: The key set
          type: array
          items:
            $ref: "#/components/schemas/JsonWebKeyDto"
      required:
        - keys
    OpenIDConfiguration:
      type: object
      properties:
        issuer:
          type: string
          description: Issuer of the OpenID configuration
        authorization_endpoint:
          type: string
          description: Authorization endpoint
        token_endpoint:
          type: string
          description: Token endpoint
        userinfo_endpoint:
          type: string
          description: Userinfo endpoint
        introspection_endpoint:
          type: string
          description: Introspection endpoint
        device_authorization_endpoint:
          type: string
          description: Device authorization endpoint
        revocation_endpoint:
          type: string
          description: Revocation endpoint
        jwks_uri:
          type: string
          description: JWKS URI
        response_types_supported:
          description: Supported response types
          type: array
          items:
            type: string
        response_modes_supported:
          description: Supported response modes
          type: array
          items:
            type: string
        id_token_signing_alg_values_supported:
          description: Supported ID token signing algorithms
          type: array
          items:
            type: string
        scopes_supported:
          description: Supported scopes
          type: array
          items:
            type: string
        grant_types_supported:
          description: Supported grant types
          type: array
          items:
            type: string
        subject_types_supported:
          description: Supported subject types
          type: array
          items:
            type: string
        claims_supported:
          description: Supported claims
          type: array
          items:
            type: string
      required:
        - issuer
        - authorization_endpoint
        - token_endpoint
        - jwks_uri
        - response_types_supported
        - id_token_signing_alg_values_supported
        - subject_types_supported
    ClientDto:
      type: object
      properties:
        id:
          type: number
          example: 1
        name:
          type: string
          example: Example Client
        secretName:
          type: string
          example: SecretExample
        description:
          type: string
          example: A sample client used for demonstration purposes.
        clientId:
          type: string
          example: client-id-123
        clientSecret:
          type: string
          example: client-secret-abc
        roles:
          example:
            - admin
            - user
          type: array
          items:
            type: string
        grants:
          example:
            - authorization_code
            - client_credentials
          type: array
          items:
            type: string
        redirectUris:
          example:
            - https://example.com/callback
          type: array
          items:
            type: string
      required:
        - name
        - secretName
        - description
        - clientId
        - clientSecret
        - roles
        - grants
        - redirectUris
externalDocs:
  description: Git Repository
  url: https://gitlab.com/tno-tsg/dataspace-protocol/tno-security-gateway
