openapi: 3.0.0
paths:
  /api/catalog:
    get:
      operationId: DataPlaneController_getCatalog
      summary: Get catalog
      description: Get catalog, currently not implemented.
      parameters: []
      responses:
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "501":
          description: ""
      tags: &a1
        - Data Plane
      security: &a2
        - oauth2:
            - controlplane_dataplane
  /health:
    get:
      operationId: DataPlaneController_healthCheck
      summary: Health check
      description: Retrieves the current health of the control plane. If the control
        plane is running it always returns an empty 200 OK
      parameters: []
      responses:
        "200":
          description: ""
        "502":
          description: ""
      tags: *a1
      security: *a2
  /api/transfers/request/{role}:
    post:
      operationId: DataPlaneController_requestTransfer
      summary: Request Transfer
      description: Requests a transfer from control plane to data plane.
      parameters:
        - name: role
          required: true
          in: path
          schema:
            type: string
        - name: processId
          required: true
          in: query
          schema:
            type: string
        - name: x-remote-party
          required: true
          in: header
          schema:
            type: string
        - name: x-dataset-id
          required: true
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRequestMessageSchema"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataPlaneRequestResponseSchema"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: *a1
      security: *a2
  /api/transfers/{id}/start:
    post:
      operationId: DataPlaneController_startTransfer
      summary: Start transfer process
      parameters:
        - name: id
          required: true
          in: path
          description: Transfer ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferStartMessageSchema"
      responses:
        "202":
          description: Transfer started successfully
      tags: *a1
      security: *a2
  /api/transfers/{id}/complete:
    post:
      operationId: DataPlaneController_completeTransfer
      summary: Complete transfer process
      parameters:
        - name: id
          required: true
          in: path
          description: Transfer ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferCompletionMessageSchema"
      responses:
        "202":
          description: Transfer completed successfully
      tags: *a1
      security: *a2
  /api/transfers/{id}/terminate:
    post:
      operationId: DataPlaneController_terminateTransfer
      summary: Terminate transfer process
      parameters:
        - name: id
          required: true
          in: path
          description: Transfer ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferTerminationMessageSchema"
      responses:
        "202":
          description: Transfer terminated successfully
      tags: *a1
      security: *a2
  /api/transfers/{id}/suspend:
