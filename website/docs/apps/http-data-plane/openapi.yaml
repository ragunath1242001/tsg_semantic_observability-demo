info:
  title: TSG HTTP Data Plane
  description: This OpenAPI specification shows the endpoints of the HTTP Data Plane.
  version: ""
  contact: {}
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
tags:
  - name: Health
    description: Health Controller
  - name: Settings
    description: Settings Controller
  - name: Authentication
    description: Authentication Controller
  - name: Data Plane
    description: Data Plane Controller
  - name: Data Plane Management
    description: Data Plane Management Controller
  - name: Proxy
    description: Proxy Controller
  - name: Logging
    description: Logging Controller
servers: []
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        password:
          scopes:
            httpdataplane_admin: httpdataplane_admin
            httpdataplane_dataplane: httpdataplane_dataplane
    bearer:
      scheme: bearer
      bearerFormat: VP
      type: http
      description: Verifiable Presentation needed to communicate between two instances
        of the control plane.
  schemas:
    RuntimeConfigDto:
      type: object
      properties:
        color:
          type: string
          example: "#3B8BF6"
        darkThemeUrl:
          type: string
          example: https://example.com/darktheme.png
        lightThemeUrl:
          type: string
          example: https://example.com/lighttheme.png
      required:
        - color
    ErrorDto:
      type: object
      properties:
        name:
          type: string
          example: ResourceNotFound
        status:
          type: string
          example: 404 Not Found
        code:
          type: number
          example: 404
        message:
          type: object
          example: The requested resource does not exist.
        error:
          type: string
          example: Not Found
      required:
        - name
        - status
        - code
    ConstraintSchema:
      type: object
      properties:
        "@type":
          type: string
          example: odrl:Constraint
        odrl:leftOperand:
          type: string
          example: odrl:leftOperandExample
        odrl:operator:
          type: string
          example: odrl:operatorExample
        odrl:rightOperand:
          type: object
          example:
            value: rightOperandExample
        odrl:rightOperandReference:
          type: string
          example: rightOperandReferenceExample
      required:
        - "@type"
        - odrl:leftOperand
        - odrl:operator
    PermissionSchema:
      type: object
      properties:
        "@type":
          type: string
          example: odrl:Permission
        odrl:assigner:
          type: string
          example: assignerExample
        odrl:assignee:
          type: string
          example: assigneeExample
        odrl:action:
          type: string
          example: odrl:actionExample
        odrl:target:
          type: string
          example: targetExample
        odrl:constraint:
          example: &a15 []
          type: array
          items:
            $ref: "#/components/schemas/ConstraintSchema"
        odrl:Duty:
          example: []
          type: array
          items:
            type: string
      required:
        - "@type"
        - odrl:action
    ProhibitionSchema:
      type: object
      properties:
        "@type":
          type: string
          example: odrl:Prohibition
        odrl:assigner:
          type: string
          example: assignerExample
        odrl:assignee:
          type: string
          example: assigneeExample
        odrl:action:
          type: string
          example: odrl:actionExample
        odrl:target:
          type: string
          example: targetExample
        odrl:constraint:
          example: *a15
          type: array
          items:
            $ref: "#/components/schemas/ConstraintSchema"
      required:
        - "@type"
        - odrl:action
    DutySchema:
      type: object
      properties:
        "@type":
          type: string
          example: odrl:Duty
        odrl:assigner:
          type: string
          example: assignerExample
        odrl:assignee:
          type: string
          example: assigneeExample
        odrl:action:
          type: string
