  /api/transfers/request/{role}:
    post:
      description: Requests a transfer from control plane to data plane.
      operationId: TransferController_requestTransfer
      parameters:
        - name: role
          required: true
          in: path
          schema:
            type: string
        - name: processId
          required: true
          in: query
          schema:
            type: string
        - name: x-remote-party
          required: true
          in: header
          schema:
            type: string
        - name: x-dataset-id
          required: true
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRequestMessageSchema"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataPlaneRequestResponseDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security: &a10
        - oauth2:
            - controlplane_dataplane
      summary: Request Transfer
      tags: &a11
        - Data Plane
  /api/transfers/{id}/start:
    post:
      operationId: TransferController_startTransfer
