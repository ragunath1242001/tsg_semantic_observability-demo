  /api/presentations:
    get:
      description: Generates a Veriable Presentation in Jwt or JSON-LD format for one
        of the credentials in this wallet
      operationId: DirectPresentationController_createPresentation
      parameters:
        - name: credentialId
          required: true
          in: query
          schema:
            type: string
        - name: asJwt
          required: true
          in: query
          schema:
            type: boolean
        - name: unwrap
          required: true
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                oneOf:
