openapi: 3.0.0
paths:
  /health:
    get:
      operationId: HealthController_getHealth
      summary: Health check
      description: Retrieves the current health of the wallet. If the wallet is
        running it always returns an empty 200 OK
      parameters: []
      responses:
        "200":
          description: ""
        "502":
          description: ""
      tags:
        - Health
  /api/settings:
    get:
      operationId: ConfigController_getSettings
      summary: Retrieve settings
      description: Retrieve dynamic settings for this wallet
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeConfigDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: &a1
        - Settings
      security: &a2
        - oauth2:
            - wallet_issue_credentials
  /api/settings/update:
    post:
      operationId: ConfigController_updateSettings
      summary: Update settings
      description: Update the dynamic settings for this wallet
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeConfigDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeConfigDto"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: *a1
      security: *a2
  /api/presentations:
    get:
      operationId: DirectPresentationController_createPresentation
      summary: Request a presentation
      description: Generates a Veriable Presentation in Jwt or JSON-LD format for one
        of the credentials in this wallet
      parameters:
        - name: credentialId
          required: true
          in: query
          schema:
            type: string
        - name: asJwt
          required: true
          in: query
          schema:
            type: boolean
        - name: unwrap
          required: true
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/VerifiablePresentationJwtDto"
                  - $ref: "#/components/schemas/VerifiablePresentationJsonLdDto"
      tags: &a3
        - Presentation Direct
      security: &a4
        - oauth2:
            - wallet_view_presentations
  /api/presentations/validate:
    post:
      operationId: DirectPresentationController_validatePresentation
      summary: Validate presentation
      description: Validates a Jwt-based Verifiable Presentation according to a fixed
        set of requirements
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifiablePresentationJwtDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationValidationDto"
      tags: *a3
      security: *a4
  /api/iatp/holder/token:
    get:
      operationId: IatpHolderController_createSIToken
      summary: Request a SIOP token
      description: Generates a SIOP token for the provided audience to allow it to
        request presentations
      parameters:
        - name: audience
          required: true
          in: query
          schema:
            type: string
        - name: scope
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  id_token:
                    type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: &a5
        - Presentation IATP
      security:
        - oauth2:
            - wallet_view_presentations
  /api/iatp/holder/presentation:
    get:
      operationId: IatpHolderController_getPresentation
      summary: Retrieve presentation
      description: Request a presentation with a SIOP-token and a presentation definition
      parameters:
        - name: presentation_definition
          required: true
          in: query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationResponseDto"
          schema:
            type: string
        - name: Authorization
          required: true
          in: header
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationResponseDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: *a5
  /api/iatp/verifier/verify:
    post:
      operationId: IatpVerifierController_verify
      summary: Start verification flow
      description: Request a new IATP presentation flow to start as verifier, based on
        a presentation defintion and a holder SIOP token
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifiablePresentationDto"
      tags:
        - Presentation IATP
      security:
        - oauth2:
            - wallet_view_presentations
  /api/auth/user:
    get:
      operationId: AuthController_getUser
      summary: Retrieve current user status
      description: Retrieves current user state, whether someone is logged in or not a
        200 result is provided. This is used in the frontend to determine
        whether certain aspects should be shown.
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticatedUserDto"
                  - $ref: "#/components/schemas/UnauthenticatedUserDto"
      tags: &a6
        - Authentication
  /api/auth/login:
    get:
      operationId: AuthController_login
      summary: Login redirect
      description: Redirects user to the correct authorization server
      parameters: []
      responses:
        "302":
          description: ""
      tags: *a6
  /api/auth/logout:
    get:
      operationId: AuthController_logout
      summary: Logout redirect
      description: Removes session information and redirects user the root of the
        frontend (`auth.redirectURL`)
      parameters: []
      responses:
        "302":
          description: ""
      tags: *a6
  /api/auth/callback:
    get:
      operationId: AuthController_callback
      summary: Login callback
      description: Users are redirected from the authorization server to this endpoint
        which will redirect them to the frontend (`auth.redirectURL`)
      parameters: []
      responses:
        "302":
          description: ""
      tags: *a6
  /api/credentials:
    get:
      operationId: CredentialsController_getCredentials
      summary: List dataspace credentials
      description: List all credentials in this dataspace.
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CredentialsDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: &a7
        - Credentials
  /api/credentials/{credentialId}:
    get:
      operationId: CredentialsController_getCredential
      summary: Retrieve credential
      description: Retrieve a specific Verifiable Credential issued by this wallet
      parameters:
        - name: credentialId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsDto"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: *a7
  /api/management/credentials:
    get:
      operationId: CredentialsManagementController_getCredentials
      summary: List credentials
      description: List all credentials, that the current user is allowed to view, in
        this wallet
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CredentialsDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: &a8
        - Management Credentials
      security: &a10
        - &a9
          oauth2:
            - wallet_view_all_credentials
            - wallet_view_own_credentials
    post:
      operationId: CredentialsManagementController_addCredential
      summary: Add credential
      description: Issue a new credential within this wallet
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialConfigDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsDto"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "409":
          description: Resource already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: *a8
      security:
        - *a9
        - oauth2:
            - wallet_manage_all_credentials
            - wallet_manage_own_credentials
  /api/management/credentials/dataspace:
    get:
      operationId: CredentialsManagementController_getDataspaceCredentials
      summary: List dataspace credentials
      description: List all credentials in this dataspace.
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CredentialsDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: *a8
      security: *a10
  /api/management/credentials/config:
    get:
      operationId: CredentialsManagementController_getConfig
      summary: Retrieve credential configuration
      description: Retrieves credential configuration that can be used by this wallet.
        Contains both trust anchors and JSON-LD contexts.
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialConfigDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: *a8
      security: *a10
  /api/management/credentials/import:
    post:
      operationId: CredentialsManagementController_importCredential
      summary: Import credential
      description: Import a credential issued by an external credential issuer
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifiableCredentialDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "409":
          description: Resource already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: *a8
      security:
        - *a9
        - oauth2:
            - wallet_manage_all_credentials
            - wallet_manage_own_credentials
  /api/management/credentials/{credentialId}:
    get:
      operationId: CredentialsManagementController_getCredential
      summary: Retrieve credential
      description: Retrieve a specific credential within this wallet
      parameters:
        - name: credentialId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: *a8
      security:
        - *a9
        - oauth2:
            - wallet_manage_all_credentials
            - wallet_manage_own_credentials
    put:
      operationId: CredentialsManagementController_updateCredential
      summary: Update credential
      description: "Update a credential within this wallet. __*Note*__: this will
        either self-issue or import a credential."
      parameters:
        - name: credentialId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialConfigDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: *a8
      security:
        - *a9
        - oauth2:
            - wallet_manage_all_credentials
            - wallet_manage_own_credentials
    delete:
      operationId: CredentialsManagementController_deleteCredential
      summary: Delete credential
      description: Deletes an existing credential within this wallet
      parameters:
        - name: credentialId
          required: true
          in: path
          schema:
            type: string
      responses:
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: *a8
      security:
        - *a9
        - oauth2:
            - wallet_manage_all_credentials
            - wallet_manage_own_credentials
  /api/management/credentials/gaiax/legalRegistrationNumber:
    post:
      operationId: GaiaXManagementController_requestLegalRegistrationNumberCredential
      summary: Issue legal registration number credential
      description: Self-issue a Legal Registration Number credential following the
        Gaia-X Trust Framework
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegalRegistrationNumberRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsDto"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: &a11
        - Management Gaia-X Credentials
      security: &a12
        - oauth2:
            - wallet_manage_all_credentials
            - wallet_manage_own_credentials
  /api/management/credentials/gaiax/compliance:
    post:
      operationId: GaiaXManagementController_requestComplianceCredential
      summary: Request compliance credential
      description: Request a compliance credential from a Gaia-X Digital Clearing
        House based on existing credentials within this wallet
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplianceRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsDto"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: *a11
      security: *a12
  /keys/{id}:
    get:
      operationId: KeysController_getCaChain
      summary: Retrieve Key CA chain
      description: Retrieves the CA chain for a given key. Only supported for keys
        with type `X509`
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags:
        - Keys
  /api/management/keys:
    get:
      operationId: KeysManagementController_getKeys
      summary: Retrieve keys
      description: Retrieves all keys registered for this wallet
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KeyInfoDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: &a13
        - Management Keys
      security: &a14
        - oauth2:
            - wallet_manage_keys
    post:
      operationId: KeysManagementController_addKey
      summary: Add key
      description: Generates a new key based on the provided configuration
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyConfigDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyInfoDto"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "409":
          description: Resource already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: *a13
      security: *a14
  /api/management/keys/{keyId}:
    get:
      operationId: KeysManagementController_getKey
      summary: Retrieve key
      description: Retrieves key information of a specific key within this wallet
      parameters:
        - name: keyId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyInfoDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: *a13
      security: *a14
    delete:
      operationId: KeysManagementController_deleteKey
      summary: Delete key
      description: Deletes an existing key within this wallet
      parameters:
        - name: keyId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: *a13
      security: *a14
  /api/management/keys/{keyId}/default:
    put:
      operationId: KeysManagementController_setDefaultKey
      summary: Set default key
      description: Sets the provided key as default key within this wallet, will
        remove the default key flag for other keys in this wallet
      parameters:
        - name: keyId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: *a13
      security: *a14
  /api/management/signature/sign:
    post:
      operationId: SignatureManagementController_sign
      summary: Sign document
      description: Sign a JSON document with default or defined key
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonWebSignatureDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: &a15
        - Management Signatures
      security: &a16
        - oauth2:
            - wallet_use_keys
            - wallet_manage_keys
  /api/management/signature/validate:
    post:
      operationId: SignatureManagementController_validate
      summary: Validate signed document
      description: Validates a document that includes a `proof` property
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonWebSignatureDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: *a15
      security: *a16
  /api/management/did:
    get:
      operationId: DIDManagementController_getDidDocument
      summary: Retrieve DID document
      description: Retrieves the current DID document for this wallet
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DIDDocumentDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: &a17
        - Management DID
      security: &a18
        - oauth2:
            - wallet_view_did
  /api/management/did/resolve/{didId}:
    get:
      operationId: DIDManagementController_resolveDidDocument
      summary: Resolve DID document
      description: Resolves the DID identifier from the path parameter into a DID Document
      parameters:
        - name: didId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DIDDocumentDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: *a17
      security: *a18
  /api/management/did/services:
    get:
      operationId: DIDManagementController_getServices
      summary: Retrieve DID services
      description: Retrieves the currently registered DID services for this wallet
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: *a17
      security: *a18
    post:
      operationId: DIDManagementController_addService
      summary: Add DID service
      description: Registers a new DID service for this wallet
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DidServiceConfigDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "409":
          description: Resource already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: *a17
