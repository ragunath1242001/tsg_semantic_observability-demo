info:
  title: TSG Wallet
  description: >-
    The TSG Wallet is a SSI wallet that can issue and store verifiable
    credentials and create presentations to be used within data spaces.<br /><br
    />
        The wallet is aimed at multi-tier deployments, with one (or more) wallet that acts as trust anchor for a data space and indivual wallets for each of the participants in the data space. On this page the central wallet that issues credentials will be called the Dataspace Wallet although it is not required that there always is exactly one issuer of credentials in a dataspace.<br /><br />
        __*Note*__: This OpenAPI definition is not intended to be directly linked with a single Wallet instance. 
  version: ""
  contact: {}
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
tags:
  - name: Health
    description: Health controller
  - name: Settings
    description: Settings controller
  - name: Authentication
    description: Authentication Controller
  - name: DID
    description: DID Controller
  - name: Contexts
    description: Contexts Controller
  - name: Keys
    description: Keys Controller
  - name: Credentials
    description: Credentials Controller
  - name: Management DID
    description: Management DID Controller
  - name: Management Contexts
    description: Management Contexts Controller
  - name: Management Keys
    description: Management Keys Controller
  - name: Management Credentials
    description: Management Credentials Controller
  - name: Management Gaia-X Credentials
    description: Management Gaia-X Credentials Controller
  - name: Management Presentation
    description: Management Presentation Controller
  - name: OpenID 4 Verifiable Credential Issuance
    description: OpenID 4 Verifiable Credential Issuance Controller
  - name: Presentation DCP
    description: Presentation DCP Controller
  - name: Presentation Direct
    description: Presentation Direct Controller
servers: []
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        password:
          scopes:
            wallet_view_did: wallet_view_did
            wallet_manage_keys: wallet_manage_keys
            wallet_use_keys: wallet_use_keys
            wallet_view_own_credentials: wallet_view_own_credentials
            wallet_view_all_credentials: wallet_view_all_credentials
            wallet_manage_own_credentials: wallet_manage_own_credentials
            wallet_manage_all_credentials: wallet_manage_all_credentials
            wallet_issue_credentials: wallet_issue_credentials
            wallet_view_presentations: wallet_view_presentations
  schemas:
    RuntimeConfigDto:
      type: object
      properties:
        gaiaXSupport:
          type: boolean
        title:
          type: string
        color:
          type: string
        darkThemeUrl:
          type: string
        lightThemeUrl:
          type: string
      required:
        - gaiaXSupport
        - title
        - color
        - darkThemeUrl
        - lightThemeUrl
    ErrorDto:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
        code:
          type: number
        message:
          type: object
        error:
          type: string
      required:
        - name
        - status
        - code
    DatabaseStatusDto:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MemoryUsageDto:
      type: object
      properties:
        does_zap_garbage:
          type: number
        external_memory:
          type: number
        heap_size_limit:
          type: number
        malloced_memory:
          type: number
        number_of_detached_contexts:
          type: number
        number_of_native_contexts:
          type: number
        peak_malloced_memory:
          type: number
        total_available_size:
          type: number
        total_global_handles_size:
          type: number
        total_heap_size:
          type: number
        total_heap_size_executable:
          type: number
        total_physical_size:
          type: number
        used_global_handles_size:
          type: number
        used_heap_size:
          type: number
      required:
        - does_zap_garbage
        - external_memory
        - heap_size_limit
        - malloced_memory
        - number_of_detached_contexts
        - number_of_native_contexts
        - peak_malloced_memory
        - total_available_size
        - total_global_handles_size
        - total_heap_size
        - total_heap_size_executable
        - total_physical_size
        - used_global_handles_size
        - used_heap_size
    IssuanceStatusDto:
      type: object
      properties:
        issued:
          type: number
        open:
          type: number
      required:
        - issued
        - open
    CredentialStatusDto:
      type: object
      properties:
        selfSigned:
          type: number
        thirdParty:
          type: number
      required:
        - selfSigned
        - thirdParty
    StatusDto:
      type: object
      properties:
        database:
          $ref: "#/components/schemas/DatabaseStatusDto"
        uptime:
          type: number
        memoryUsage:
          $ref: "#/components/schemas/MemoryUsageDto"
        issuance:
          $ref: "#/components/schemas/IssuanceStatusDto"
        credentials:
          $ref: "#/components/schemas/CredentialStatusDto"
        keys:
          type: number
      required:
        - database
        - uptime
        - memoryUsage
        - issuance
        - credentials
        - keys
    CredentialStatusRequest:
      type: object
      properties:
        statusListCredential:
          type: string
        statusListIndex:
          type: string
      required:
        - statusListCredential
        - statusListIndex
    VerifiedCredentialStatus:
      type: object
      properties:
        statusListCredential:
          type: string
        statusListIndex:
          type: string
        statusPurpose:
          type: string
          enum:
            - refresh
            - revocation
            - suspension
            - message
        status:
          type: boolean
      required:
        - statusListCredential
        - statusListIndex
        - statusPurpose
        - status
    DescriptorMap:
      type: object
      properties:
        id:
          type: string
        format:
          type: string
        path:
          type: string
        path_nested:
          $ref: "#/components/schemas/DescriptorMap"
      required:
        - id
        - format
        - path
    PresentationSubmission:
      type: object
      properties:
        id:
          type: string
        definition_id:
          type: string
        descriptor_map:
          type: array
          items:
            $ref: "#/components/schemas/DescriptorMap"
      required:
        - id
        - definition_id
        - descriptor_map
    AuthorizationResponse:
      type: object
      properties:
        vp_token:
          type: string
        presentation_submission:
          $ref: "#/components/schemas/PresentationSubmission"
        state:
          type: string
      required:
        - vp_token
        - presentation_submission
        - state
    JwtVpClaimFormat:
      type: object
      properties:
        alg:
          type: array
          items:
            type: string
      required:
        - alg
    Format:
      type: object
      properties:
        jwt_vp:
          $ref: "#/components/schemas/JwtVpClaimFormat"
    FilterItems:
      type: object
      properties:
        const:
          type: object
        enum:
          type: array
          items:
            type: number
        exclusiveMinimum:
          type: object
        exclusiveMaximum:
          type: object
        format:
          type: string
        minLength:
          type: number
        maxLength:
          type: number
        minimum:
          type: object
        maximum:
          type: object
        not:
          $ref: "#/components/schemas/FilterItems"
        pattern:
          type: string
        contains:
          $ref: "#/components/schemas/FilterItems"
        items:
          type: object
    Filter:
      type: object
      properties:
        const:
          type: object
        enum:
          type: array
          items:
            type: number
        exclusiveMinimum:
          type: object
        exclusiveMaximum:
          type: object
        format:
          type: string
        minLength:
          type: number
        maxLength:
          type: number
        minimum:
          type: object
        maximum:
          type: object
        not:
          $ref: "#/components/schemas/FilterItems"
        pattern:
          type: string
        contains:
          $ref: "#/components/schemas/FilterItems"
        items:
          type: object
        type:
          type: string
      required:
        - type
    Field:
      type: object
      properties:
        path:
          type: array
          items:
            type: string
        id:
          type: string
        purpose:
          type: string
        name:
          type: string
        filter:
          $ref: "#/components/schemas/Filter"
        optional:
          type: boolean
      required:
        - path
    Constraint:
      type: object
      properties:
        fields:
          type: array
          items:
            $ref: "#/components/schemas/Field"
        limit_disclosure:
          type: string
          enum:
            - required
            - preferred
    InputDescriptor:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        purpose:
          type: string
        format:
