  /api/management/dcp/holder/token:
    get:
      description: Generates a SIOP token for the provided audience to allow it to
        request presentations
      operationId: DCPHolderManagementController_createSIToken
      parameters:
        - name: audience
          required: true
          in: query
          schema:
            type: string
