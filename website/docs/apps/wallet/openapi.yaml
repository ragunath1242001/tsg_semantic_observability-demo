openapi: 3.0.0
paths:
  /health:
    get:
      description: Retrieves the current health of the app. If the app is running and
        it is connected to the database it always returns an empty 200 OK
      operationId: HealthController_getHealth
      parameters: []
      responses:
        "200":
          description: ""
        "502":
          description: ""
        "503":
          description: The Health Check is not successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  info:
                    type: object
                    example:
                      database: &a1
                        status: up
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  error:
                    type: object
                    example:
                      redis: &a2
                        status: down
                        message: Could not connect
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  details:
                    type: object
                    example:
                      database: *a1
                      redis: *a2
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
      summary: Health check
      tags:
        - Health
  /api/settings:
    get:
      description: Retrieve dynamic settings for this wallet
      operationId: ConfigController_getSettings
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeConfigDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security: &a3
        - oauth2:
            - wallet_issue_credentials
      summary: Retrieve settings
      tags: &a4
        - Settings
  /api/settings/update:
    post:
      description: Update the dynamic settings for this wallet
      operationId: ConfigController_updateSettings
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeConfigDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeConfigDto"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security: *a3
      summary: Update settings
      tags: *a4
  /api/settings/upload:
    post:
      description: Uploads logo for the control plane, receive a base64 encoded url.
      operationId: ConfigController_uploadFile
      parameters: []
      responses:
        "200":
          description: ""
      security: *a3
      summary: Upload logo
      tags: *a4
  /api/status:
    get:
      description: Retrieves the current health of the control plane. With additional
        status information
      operationId: StatusController_getStatus
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusDto"
        "502":
          description: ""
      summary: Application status
      tags:
        - Status
  /api/management/presentation/status:
    post:
      description: Get the status of a credential
      operationId: PresentationManagementController_status
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialStatusRequest"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifiedCredentialStatus"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security:
        - oauth2:
            - wallet_view_presentations
      summary: Get the status of a credential
      tags:
        - Management Presentation
  /api/oid4vp/ar/{id}:
    get:
      description: Get the Authorization Request according to the OID4VP specification.
      operationId: OID4VPVerifierController_getAuthorizationRequest
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      summary: Get the Authorization Request
      tags: &a5
        - OID4VP
  /api/oid4vp/authorize:
    post:
      description: Add an Authorization Request according to the OID4VP specification.
      operationId: OID4VPVerifierController_status
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationResponse"
      responses:
        "200":
          description: ""
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      summary: Add an Authorization Request
      tags: *a5
  /api/management/oid4vp/verifier/create:
    post:
      description: Add an Authorization Request according to the OID4VP specification.
      operationId: OID4VPVerifierManagementController_status
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresentationDefinition"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security:
        - oauth2:
            - wallet_view_presentations
      summary: Add an Authorization Request
      tags:
        - OID4VP
  /api/presentations:
    get:
      description: Generates a Veriable Presentation in Jwt or JSON-LD format for one
        of the credentials in this wallet
      operationId: DirectPresentationController_createPresentation
      parameters:
        - name: credentialId
          required: true
          in: query
          schema:
            type: string
        - name: asJwt
          required: true
          in: query
          schema:
            type: boolean
        - name: unwrap
          required: true
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/VerifiablePresentationJwt"
                  - $ref: "#/components/schemas/VerifiablePresentationJsonLd"
      security: &a6
        - oauth2:
            - wallet_view_presentations
      summary: Request a presentation
      tags: &a7
        - Presentation Direct
  /api/presentations/validate:
    post:
      description: Validates a Jwt-based Verifiable Presentation according to a fixed
        set of requirements
      operationId: DirectPresentationController_validatePresentation
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifiablePresentationJwt"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationValidation"
      security: *a6
      summary: Validate presentation
      tags: *a7
  /api/dcp/presentations/query:
    post:
      description: Request a presentation with a SIOP-token and a PresentationQueryMessage
      operationId: DCPHolderController_presentationQuery
      parameters:
        - name: Authorization
          required: true
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresentationQueryMessage"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationResponseMessage"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      summary: Retrieve presentation
      tags:
        - Presentation DCP
  /api/management/dcp/holder/token:
    get:
      description: Generates a SIOP token for the provided audience to allow it to
        request presentations
      operationId: DCPHolderManagementController_createSIToken
      parameters:
        - name: audience
          required: true
          in: query
          schema:
            type: string
        - name: scope
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  id_token:
                    type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security:
        - oauth2:
            - wallet_view_presentations
      summary: Request a SIOP token
      tags:
        - Presentation DCP
  /api/management/dcp/verifier/verify:
    post:
      description: Request a new DCP presentation flow to start as verifier, based on
        a presentation defintion and a holder SIOP token
      operationId: DCPVerifierManagementController_verify
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationRequest"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VerifiablePresentation"
      security:
        - oauth2:
            - wallet_view_presentations
      summary: Start verification flow
      tags:
        - Presentation DCP
  /api/auth/user:
    get:
      description: Retrieves current user state, whether someone is logged in or not a
        200 result is provided. This is used in the frontend to determine
        whether certain aspects should be shown.
      operationId: AuthController_getUser
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticatedUser"
                  - $ref: "#/components/schemas/UnauthenticatedUser"
      summary: Retrieve current user status
      tags: &a8
        - Authentication
  /api/auth/login:
    get:
      description: Redirects user to the correct authorization server
      operationId: AuthController_login
      parameters: []
      responses:
        "302":
          description: ""
      summary: Login redirect
      tags: *a8
  /api/auth/logout:
    get:
      description: Removes session information and redirects user the root of the
        frontend (`auth.redirectURL`)
      operationId: AuthController_logout
      parameters: []
      responses:
        "302":
          description: ""
      summary: Logout redirect
      tags: *a8
  /api/auth/callback:
    get:
      description: Users are redirected from the authorization server to this endpoint
        which will redirect them to the frontend (`auth.redirectURL`)
      operationId: AuthController_callback
      parameters:
        - name: state
          required: false
          in: query
          description: The state parameter
          schema:
            example: randomState
            type: string
        - name: code
          required: false
          in: query
          description: The authorization code
          schema:
            example: code
            type: string
        - name: access_token
          required: false
          in: query
          description: The access token
          schema:
            type: string
        - name: token_type
          required: false
          in: query
          description: The token type
          schema:
            example: Bearer
            type: string
        - name: expires_in
          required: false
          in: query
          description: The token expiration in seconds
          schema:
            example: 3600
            type: string
        - name: id_token
          required: false
          in: query
          description: The ID token
          schema:
            type: string
        - name: code_verifier
          required: false
          in: query
          description: The code verifier
          schema:
            example: randomChallengeVerifier
            type: string
      responses:
        "302":
          description: ""
      summary: Login callback
      tags: *a8
  /api/credentials:
    get:
      description: List all credentials in this dataspace.
      operationId: CredentialsController_getCredentials
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CredentialsDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      summary: List dataspace credentials
      tags: &a9
        - Credentials
  /api/credentials/{credentialId}:
    get:
      description: Retrieve a specific Verifiable Credential issued by this wallet
      operationId: CredentialsController_getCredential
      parameters:
        - name: credentialId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsDto"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      summary: Retrieve credential
      tags: *a9
  /api/management/credentials:
    get:
      description: List all credentials, that the current user is allowed to view, in
        this wallet
      operationId: CredentialsManagementController_getCredentials
      parameters:
        - name: order
          required: false
          in: query
          schema:
            default: DESC
            type: string
            enum:
              - ASC
              - DESC
        - name: order_by
          required: false
          in: query
          schema:
            default: modifiedDate
            type: string
        - name: page
          required: false
          in: query
          schema:
            minimum: 1
            default: 1
            type: number
        - name: per_page
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 100
            type: number
      responses:
        "200":
          description: ""
          headers:
            x-page:
              description: Index of the current page (starting at 1)
              schema:
                type: integer
            x-prev-page:
              description: Index of the previous page
              schema:
                type: integer
              required: false
            x-next-page:
              description: Index of the next page
              schema:
                type: integer
              required: false
            x-per-page:
              description: Number of items per page
              schema:
                type: integer
            x-total-pages:
              description: Total number of pages
              schema:
                type: integer
            x-total:
              description: Total number of items
              schema:
                type: integer
            link:
              description: Web Linking to other pages of this resource
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CredentialsDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security: &a12
        - &a10
          oauth2:
            - wallet_view_all_credentials
            - wallet_view_own_credentials
      summary: List credentials
      tags: &a11
        - Management Credentials
    post:
      description: Issue a new credential within this wallet
      operationId: CredentialsManagementController_addCredential
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialConfigDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsDto"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "409":
          description: Resource already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security:
        - *a10
        - oauth2:
            - wallet_manage_all_credentials
            - wallet_manage_own_credentials
      summary: Add credential
      tags: *a11
  /api/management/credentials/dataspace:
    get:
      description: List all credentials in this dataspace.
      operationId: CredentialsManagementController_getDataspaceCredentials
      parameters:
        - name: issuerIds
          required: false
          in: query
          description: Comma-separated list of issuer IDs to retrieve dataspace
            credentials from
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CredentialsDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security: *a12
      summary: List dataspace credentials
      tags: *a11
  /api/management/credentials/config:
    get:
      description: Retrieves credential configuration that can be used by this wallet.
        Contains both trust anchors and JSON-LD contexts.
      operationId: CredentialsManagementController_getConfig
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialConfigDto"
      security: *a12
      summary: Retrieve credential configuration
      tags: *a11
  /api/management/credentials/import:
    post:
      description: Import a credential issued by an external credential issuer
      operationId: CredentialsManagementController_importCredential
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifiableCredential"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "409":
          description: Resource already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security:
        - *a10
        - oauth2:
            - wallet_manage_all_credentials
            - wallet_manage_own_credentials
      summary: Import credential
      tags: *a11
  /api/management/credentials/{credentialId}:
    get:
      description: Retrieve a specific credential within this wallet
      operationId: CredentialsManagementController_getCredential
      parameters:
        - name: credentialId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security:
        - *a10
        - oauth2:
            - wallet_manage_all_credentials
            - wallet_manage_own_credentials
      summary: Retrieve credential
      tags: *a11
    put:
      description: "Update a credential within this wallet. __*Note*__: this will
        either self-issue or import a credential."
      operationId: CredentialsManagementController_updateCredential
      parameters:
        - name: credentialId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialConfigDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security:
        - *a10
        - oauth2:
            - wallet_manage_all_credentials
            - wallet_manage_own_credentials
      summary: Update credential
      tags: *a11
    delete:
      description: Deletes an existing credential within this wallet
      operationId: CredentialsManagementController_deleteCredential
      parameters:
        - name: credentialId
          required: true
          in: path
          schema:
            type: string
      responses:
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security:
        - *a10
        - oauth2:
            - wallet_manage_all_credentials
            - wallet_manage_own_credentials
      summary: Delete credential
      tags: *a11
  /api/management/credentials/{credentialId}/revoke:
    post:
      description: Revoke credential via BitstringStatusList
      operationId: CredentialsManagementController_revokeCredential
      parameters:
        - name: credentialId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security:
        - *a10
        - oauth2:
            - wallet_manage_all_credentials
            - wallet_manage_own_credentials
      summary: Revoke credential
      tags: *a11
  /api/management/credentials/gaiax/legalRegistrationNumber:
    post:
      description: Self-issue a Legal Registration Number credential following the
        Gaia-X Trust Framework
      operationId: GaiaXManagementController_requestLegalRegistrationNumberCredential
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegalRegistrationNumberRequest"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsDto"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security: &a13
        - oauth2:
            - wallet_manage_all_credentials
            - wallet_manage_own_credentials
      summary: Issue legal registration number credential
      tags: &a14
        - Management Gaia-X Credentials
  /api/management/credentials/gaiax/compliance:
    post:
      description: Request a compliance credential from a Gaia-X Digital Clearing
        House based on existing credentials within this wallet
      operationId: GaiaXManagementController_requestComplianceCredential
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplianceRequest"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsDto"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security: *a13
      summary: Request compliance credential
      tags: *a14
  /keys/{id}:
    get:
      description: Retrieves the CA chain for a given key. Only supported for keys
        with type `X509`
      operationId: KeysController_getCaChain
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: string
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      summary: Retrieve Key CA chain
      tags:
        - Keys
  /api/management/keys:
    get:
      description: Retrieves all keys registered for this wallet
      operationId: KeysManagementController_getKeys
      parameters:
        - name: order
          required: false
          in: query
          schema:
            default: DESC
            type: string
            enum:
              - ASC
              - DESC
        - name: order_by
          required: false
          in: query
          schema:
            default: modifiedDate
            type: string
        - name: page
          required: false
          in: query
          schema:
            minimum: 1
            default: 1
            type: number
        - name: per_page
