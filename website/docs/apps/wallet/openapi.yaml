          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: *a21
      security:
        - oauth2:
            - wallet_manage_all_credentials
  /api/oid4vci/offer/{id}/revoke:
    put:
      operationId: IssuerController_revokeOffer
      summary: Revoke offer
      description: Revokes an existing credential offer, so that it cannot be used
        anymore by the holder
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialOfferStatusDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: *a21
      security:
        - oauth2:
            - wallet_manage_all_credentials
info:
  title: TSG Wallet
  description: >-
    The TSG Wallet is a SSI wallet that can issue and store verifiable
    credentials and create presentations to be used within data spaces.<br /><br
    />
        The wallet is aimed at multi-tier deployments, with one (or more) wallet that acts as trust anchor for a data space and indivual wallets for each of the participants in the data space. On this page the central wallet that issues credentials will be called the Dataspace Wallet although it is not required that there always is exactly one issuer of credentials in a dataspace.<br /><br />
        __*Note*__: This OpenAPI definition is not intended to be directly linked with a single Wallet instance. 
  version: 1.0.0
  contact: {}
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
tags:
  - name: Health
    description: Health controller
  - name: Settings
    description: Settings controller
  - name: Authentication
    description: Authentication Controller
  - name: DID
    description: DID Controller
  - name: Contexts
    description: Contexts Controller
  - name: Keys
    description: Keys Controller
  - name: Credentials
    description: Credentials Controller
  - name: Management DID
    description: Management DID Controller
  - name: Management Contexts
    description: Management Contexts Controller
  - name: Management Keys
    description: Management Keys Controller
  - name: Management Credentials
    description: Management Credentials Controller
  - name: Management Gaia-X Credentials
    description: Management Gaia-X Credentials Controller
  - name: OpenID 4 Verifiable Credential Issuance
    description: OpenID 4 Verifiable Credential Issuance Controller
  - name: Presentation IATP
    description: Presentation IATP Controller
  - name: Presentation Direct
    description: Presentation Direct Controller
servers: []
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        password:
          scopes:
            wallet_view_did: wallet_view_did
            wallet_manage_keys: wallet_manage_keys
            wallet_use_keys: wallet_use_keys
            wallet_view_own_credentials: wallet_view_own_credentials
            wallet_view_all_credentials: wallet_view_all_credentials
            wallet_manage_own_credentials: wallet_manage_own_credentials
            wallet_manage_all_credentials: wallet_manage_all_credentials
            wallet_issue_credentials: wallet_issue_credentials
            wallet_view_presentations: wallet_view_presentations
  schemas:
    RuntimeConfigDto:
      type: object
      properties:
        gaiaXSupport:
          type: boolean
      required:
        - gaiaXSupport
    ErrorDto:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
        code:
          type: number
        message:
          type: object
        error:
          type: string
      required:
        - name
        - status
        - code
    VerifiablePresentationJwtDto:
      type: object
      properties:
        vp:
          type: string
      required:
        - vp
    VerifiableCredentialDto:
      type: object
      properties:
        "@context":
          type: array
          items:
            type: string
        type:
          type: array
          items:
            type: string
        id:
          type: string
        credentialSubject:
          oneOf:
            - $ref: "#/components/schemas/DefaultCredentialSubjectDto"
            - type: array
              items:
                $ref: "#/components/schemas/DefaultCredentialSubjectDto"
        issuer:
          type: string
        expirationDate:
          type: string
          format: date-time
        issuanceDate:
          type: string
          format: date-time
        evidence:
          type: object
        proof:
          oneOf:
            - &a22
              oneOf:
                - $ref: "#/components/schemas/DataIntegrityProofDto"
                - $ref: "#/components/schemas/JsonWebSignature2020Dto"
            - type: array
              items: *a22
      required:
        - "@context"
        - type
        - credentialSubject
        - issuer
        - issuanceDate
        - proof
    VerifiablePresentationJsonLdDto:
      type: object
      properties:
        vp:
          $ref: "#/components/schemas/VerifiableCredentialDto"
      required:
        - vp
    PresentationValidationDto:
      type: object
      properties:
        valid:
          type: boolean
        validateJWTSignature:
          type: boolean
        validateJWTExpiryDate:
          type: boolean
        validateTrustAnchors:
          type: array
          items:
            type: boolean
        validateExpiryDate:
          type: array
          items:
            type: boolean
        validateCredentials:
          type: array
          items:
            type: boolean
        validateAudience:
          type: boolean
        vp:
          type: string
      required:
        - valid
        - validateJWTSignature
        - validateJWTExpiryDate
        - validateTrustAnchors
        - validateExpiryDate
        - validateCredentials
        - vp
    FormatDto:
      type: object
      properties:
        jwt_vp:
          type: object
          properties:
            alg:
              type: array
              items:
                type: string
    FieldDto:
      type: object
      properties:
        path:
          type: array
          items:
            type: string
        id:
          type: string
        purpose:
          type: string
        name:
          type: string
        filter:
          type: object
        optional:
          type: boolean
      required:
        - path
    ConstraintDto:
      type: object
      properties:
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldDto"
        limit_disclosure:
          type: string
          enum:
            - required
            - preferred
    InputDescriptorDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        purpose:
          type: string
        format:
          $ref: "#/components/schemas/FormatDto"
        constraints:
          $ref: "#/components/schemas/ConstraintDto"
      required:
        - id
        - constraints
    PresentationDefinitionDto:
      type: object
      properties:
        id:
          type: string
        input_descriptors:
          type: array
          items:
            $ref: "#/components/schemas/InputDescriptorDto"
        name:
          type: string
        purpose:
          type: string
        format:
          $ref: "#/components/schemas/FormatDto"
      required:
        - id
        - input_descriptors
    DescriptorMapDto:
      type: object
      properties:
        id:
          type: string
        format:
          type: string
        path:
          type: string
        path_nested:
          $ref: "#/components/schemas/DescriptorMapDto"
      required:
        - id
        - format
        - path
    PresentationSubmissionDto:
      type: object
      properties:
        id:
          type: string
        definition_id:
          type: string
        descriptor_map:
          type: array
          items:
            $ref: "#/components/schemas/DescriptorMapDto"
      required:
        - id
        - definition_id
        - descriptor_map
    PresentationResponseDto:
      type: object
      properties:
        vp_token:
          type: string
        presentation_submission:
          $ref: "#/components/schemas/PresentationSubmissionDto"
      required:
        - vp_token
        - presentation_submission
    VerificationRequestDto:
      type: object
      properties:
        presentationDefinition:
          $ref: "#/components/schemas/PresentationDefinitionDto"
        holderIdToken:
          type: string
      required:
        - presentationDefinition
        - holderIdToken
    VerifiablePresentationDto:
      type: object
      properties:
        "@context":
          type: array
          items:
            type: string
        type:
          type: array
          items:
            type: string
        id:
          type: string
        verifiableCredential:
          oneOf:
            - &a23
              $ref: "#/components/schemas/VerifiableCredentialDto"
            - type: array
              items: *a23
      required:
        - "@context"
        - type
        - verifiableCredential
    AppRole:
      type: string
      enum:
        - wallet_view_did
        - wallet_manage_keys
        - wallet_use_keys
        - wallet_view_own_credentials
        - wallet_view_all_credentials
        - wallet_manage_own_credentials
        - wallet_manage_all_credentials
        - wallet_issue_credentials
        - wallet_view_presentations
    ClientInfoDto:
      type: object
      properties:
        sub:
          type: string
        name:
          type: string
        email:
          type: string
        didId:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/AppRole"
      required:
        - sub
        - name
        - email
        - didId
        - roles
    AuthenticatedUserDto:
      type: object
      properties:
        state:
          type: string
        user:
          $ref: "#/components/schemas/ClientInfoDto"
      required:
        - state
        - user
    UnauthenticatedUserDto:
      type: object
      properties:
        state:
          type: string
      required:
        - state
    CredentialsDto:
      type: object
      properties:
        id:
          type: string
        targetDid:
          type: string
        credential:
          $ref: "#/components/schemas/VerifiableCredentialDto"
        selfIssued:
          type: boolean
        created:
          format: date-time
          type: string
        modified:
          format: date-time
          type: string
        deleted:
          format: date-time
          type: string
      required:
        - id
        - targetDid
        - credential
        - selfIssued
        - created
        - modified
    DefaultCredentialSubjectDto:
      type: object
      properties:
        id:
          type: string
      required:
        - id
    CredentialConfigDto:
      type: object
      properties:
        context:
          title: JSON-LD Contexts for the credential
          example:
            - https://dataspace.example/context
          type: array
          items:
            type: string
        type:
          title: Credential Type
          example:
            - DataSpaceMembershipCredential
          type: array
          items:
            type: string
        id:
          type: string
          title: Credential ID
        keyId:
          type: string
        credentialSubject:
          $ref: "#/components/schemas/DefaultCredentialSubjectDto"
      required:
        - id
        - credentialSubject
    LegalRegistrationNumberRequestDto:
      type: object
      properties:
        vcId:
          type: string
        clearingHouse:
          type: string
        credentialSubject:
          $ref: "#/components/schemas/DefaultCredentialSubjectDto"
      required:
        - vcId
        - clearingHouse
        - credentialSubject
    ComplianceRequestDto:
      type: object
      properties:
        vcId:
          type: string
        clearingHouse:
          type: string
        credentials:
          type: array
          items:
            $ref: "#/components/schemas/VerifiableCredentialDto"
      required:
        - vcId
        - clearingHouse
        - credentials
    KeyType:
      type: string
      enum:
        - EdDSA
        - ES384
        - X509
    JsonWebKeyDto:
      type: object
      properties:
        alg:
          type: string
        crv:
          type: string
        e:
          type: string
        ext:
          type: boolean
        key_ops:
          type: array
          items:
            type: string
        kid:
          type: string
        kty:
          type: string
        n:
          type: string
        use:
          type: string
        x:
          type: string
        y:
          type: string
      required:
        - kty
    KeyInfoDto:
      type: object
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/KeyType"
        default:
          type: boolean
        publicKey:
          $ref: "#/components/schemas/JsonWebKeyDto"
        created:
          format: date-time
          type: string
        modified:
          format: date-time
          type: string
      required:
        - id
        - type
        - default
        - publicKey
        - created
        - modified
    KeyConfigDto:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/KeyType"
        id:
          type: string
        default:
          type: boolean
        existingKey:
          type: string
        existingCertificate:
          type: string
      required:
        - type
        - id
        - default
    SignRequestDto:
      type: object
      properties:
        type:
          type: string
        plainDocument:
          type: object
        keyId:
          type: string
        normalization:
          type: string
        proofPurpose:
          type: string
        options:
          type: object
        embeddedVerificationMethod:
          type: boolean
      required:
        - plainDocument
    JsonWebSignature2020Dto:
      type: object
      properties:
        type:
          type: string
        created:
          type: string
          format: date-time
        proofPurpose:
          type: string
        jws:
          type: string
        verificationMethod:
          type: string
      required:
        - type
        - created
        - proofPurpose
        - jws
        - verificationMethod
    JsonWebSignatureDto:
      type: object
      properties:
        proof:
          $ref: "#/components/schemas/JsonWebSignature2020Dto"
      required:
        - proof
    ProofDocument:
      type: object
      properties: {}
    ValidateRequestDto:
      type: object
      properties:
        proofDocument:
          $ref: "#/components/schemas/ProofDocument"
    VerificationMethodDto:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        controller:
          type: string
        publicKeyJwk:
          $ref: "#/components/schemas/JsonWebKeyDto"
      required:
        - id
        - type
        - controller
    ServiceDto:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        serviceEndpoint:
          oneOf:
            - &a24
              type: string
            - type: array
              items: *a24
      required:
        - id
        - type
        - serviceEndpoint
    DIDDocumentDto:
      type: object
      properties:
        "@context":
          oneOf:
            - &a25
              type: string
            - type: array
              items: *a25
        id:
          type: string
        alsoKnownAs:
          type: array
          items:
            type: string
        controller:
          oneOf:
            - &a26
              type: string
            - type: array
              items: *a26
        verificationMethod:
          type: array
          items:
            $ref: "#/components/schemas/VerificationMethodDto"
        service:
          type: array
          items:
            $ref: "#/components/schemas/ServiceDto"
        publicKey:
          type: array
          items:
            $ref: "#/components/schemas/VerificationMethodDto"
        authentication:
          type: array
          items:
            oneOf:
              - type: string
              - $ref: "#/components/schemas/VerificationMethodDto"
        assertionMethod:
          type: array
          items:
