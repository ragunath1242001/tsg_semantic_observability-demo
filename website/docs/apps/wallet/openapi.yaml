          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: *a19
      security: *a20
  /api/management/contexts/{id}:
    put:
      operationId: ContextManagementController_updateContext
      summary: Update context
      description: Update an existing context in this wallet
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonLdContextConfigDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JSONLDContextDto"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: *a19
      security: *a20
    delete:
      operationId: ContextManagementController_deleteContext
      summary: Delete context
      description: Delete an existing context in this wallet
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: *a19
      security: *a20
  /api/oid4vci/holder/request:
    post:
      operationId: HolderController_requestCredential
      summary: Request credential via OID4VCI
      description: Requests a new credential via the OID4VCI Pre-authorized-code flow.
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsDto"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags:
        - OpenID 4 Verifiable Credential Issuance
      security:
        - oauth2:
