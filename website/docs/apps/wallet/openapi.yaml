  /api/oid4vci/offer:
    get:
      operationId: IssuerController_listOffers
      summary: Retrieve offered credentials
      description: Retrieves all credentials offered this wallet has offered to holders
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CredentialOfferStatusDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      tags: *a21
      security:
        - oauth2:
            - wallet_manage_all_credentials
    post:
      operationId: IssuerController_offerEndpoint
      summary: Add offer
      description: Creates a new credential offer
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialOfferDto"
      responses:
