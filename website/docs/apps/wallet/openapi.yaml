        - OpenID 4 Verifiable Credential Issuance
  /.well-known/openid-credential-issuer:
    get:
      operationId: OID4VCIIssuerController_issuerMetadata
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialIssuerMetadata"
      tags: &a26
        - OpenID 4 Verifiable Credential Issuance
  /oid4vci/token:
    post:
      description: Requests an access token based on a pre authorizated code the
        holder has received off-line
      operationId: OID4VCIIssuerController_tokenEndpoint
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pre-authorized_code:
                  type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security:
        - bearer: []
      summary: Request OID4VCI access token
      tags: *a26
  /oid4vci/credential:
    post:
      description: Requests a new credential based on a Credential Request via the
        OID4VCI flow
      operationId: OID4VCIIssuerController_credentialEndpoint
      parameters:
        - name: Authorization
          required: true
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialRequest"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ImmediateCredentialResponse"
                  - $ref: "#/components/schemas/DeferredCredentialResponse"
      security:
        - bearer: []
      summary: Request OID4VCI credential
      tags: *a26
info:
  title: TSG Wallet
  description: >-
    The TSG Wallet is a SSI wallet that can issue and store verifiable
    credentials and create presentations to be used within data spaces.<br /><br
    />
        The wallet is aimed at multi-tier deployments, with one (or more) wallet that acts as trust anchor for a data space and indivual wallets for each of the participants in the data space. On this page the central wallet that issues credentials will be called the Dataspace Wallet although it is not required that there always is exactly one issuer of credentials in a dataspace.<br /><br />
        __*Note*__: This OpenAPI definition is not intended to be directly linked with a single Wallet instance. 
  version: ""
  contact: {}
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
tags:
  - name: Health
    description: Health controller
  - name: Settings
    description: Settings controller
  - name: Authentication
    description: Authentication Controller
  - name: DID
    description: DID Controller
  - name: Contexts
    description: Contexts Controller
  - name: Keys
    description: Keys Controller
  - name: Credentials
    description: Credentials Controller
  - name: Management DID
    description: Management DID Controller
  - name: Management Contexts
    description: Management Contexts Controller
  - name: Management Keys
    description: Management Keys Controller
  - name: Management Credentials
    description: Management Credentials Controller
  - name: Management Gaia-X Credentials
    description: Management Gaia-X Credentials Controller
  - name: Management Presentation
    description: Management Presentation Controller
  - name: OpenID 4 Verifiable Credential Issuance
    description: OpenID 4 Verifiable Credential Issuance Controller
  - name: Presentation DCP
    description: Presentation DCP Controller
  - name: Presentation Direct
    description: Presentation Direct Controller
servers: []
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        password:
          scopes:
            wallet_view_did: wallet_view_did
            wallet_manage_keys: wallet_manage_keys
            wallet_use_keys: wallet_use_keys
            wallet_view_own_credentials: wallet_view_own_credentials
            wallet_view_all_credentials: wallet_view_all_credentials
            wallet_manage_own_credentials: wallet_manage_own_credentials
            wallet_manage_all_credentials: wallet_manage_all_credentials
            wallet_issue_credentials: wallet_issue_credentials
            wallet_view_presentations: wallet_view_presentations
  schemas:
    RuntimeConfigDto:
      type: object
      properties:
        gaiaXSupport:
          type: boolean
          example: false
        title:
          type: string
          example: My Company Wallet
        acceptUnauthenticatedCredentialRequests:
          type: boolean
          example: false
        issueMobileCredentials:
          type: boolean
          example: false
        color:
          type: string
          example: "#3B8BF6"
        darkThemeUrl:
          type: string
          example: https://example.com/darktheme.png
        lightThemeUrl:
          type: string
          example: https://example.com/lighttheme.png
      required:
        - gaiaXSupport
        - title
        - acceptUnauthenticatedCredentialRequests
        - issueMobileCredentials
        - color
    ErrorDto:
      type: object
      properties:
        name:
          type: string
          example: ResourceNotFound
        status:
          type: string
          example: 404 Not Found
        code:
          type: number
          example: 404
        message:
          type: object
          example: The requested resource does not exist.
        error:
          type: string
          example: Not Found
      required:
        - name
        - status
        - code
    DatabaseStatusDto:
      type: object
      properties:
        status:
          type: string
          example: online
      required:
        - status
    MemoryUsageDto:
      type: object
      properties:
        does_zap_garbage:
          type: number
          example: 1024
        external_memory:
          type: number
          example: 2048
        heap_size_limit:
          type: number
          example: 4096
        malloced_memory:
          type: number
          example: 512
        number_of_detached_contexts:
          type: number
          example: 0
        number_of_native_contexts:
          type: number
          example: 2
        peak_malloced_memory:
          type: number
          example: 1024
        total_available_size:
          type: number
          example: 8192
        total_global_handles_size:
          type: number
          example: 256
        total_heap_size:
          type: number
          example: 16384
        total_heap_size_executable:
          type: number
          example: 4096
        total_physical_size:
          type: number
          example: 32768
        used_global_handles_size:
          type: number
          example: 128
        used_heap_size:
          type: number
          example: 8192
      required:
        - does_zap_garbage
        - external_memory
        - heap_size_limit
        - malloced_memory
        - number_of_detached_contexts
        - number_of_native_contexts
        - peak_malloced_memory
        - total_available_size
        - total_global_handles_size
        - total_heap_size
        - total_heap_size_executable
        - total_physical_size
        - used_global_handles_size
        - used_heap_size
    IssuanceStatusDto:
      type: object
      properties:
        issued:
          type: number
          example: 10
        open:
          type: number
          example: 2
      required:
        - issued
        - open
    CredentialStatusDto:
      type: object
      properties:
        selfSigned:
          type: number
          example: 5
        thirdParty:
          type: number
          example: 1
      required:
        - selfSigned
        - thirdParty
    StatusDto:
      type: object
      properties:
        database:
          example:
            status: online
          allOf:
            - $ref: "#/components/schemas/DatabaseStatusDto"
        uptime:
          type: number
          example: 3600
        memoryUsage:
          example:
            does_zap_garbage: 1024
            external_memory: 2048
            heap_size_limit: 4096
            malloced_memory: 512
            number_of_detached_contexts: 0
            number_of_native_contexts: 2
            peak_malloced_memory: 1024
            total_available_size: 8192
            total_global_handles_size: 256
            total_heap_size: 16384
            total_heap_size_executable: 4096
            total_physical_size: 32768
            used_global_handles_size: 128
            used_heap_size: 8192
          allOf:
            - $ref: "#/components/schemas/MemoryUsageDto"
        issuance:
          example:
            issued: 10
            open: 2
          allOf:
            - $ref: "#/components/schemas/IssuanceStatusDto"
        credentials:
          example:
            selfSigned: 5
            thirdParty: 1
          allOf:
            - $ref: "#/components/schemas/CredentialStatusDto"
        keys:
          type: number
          example: 3
      required:
        - database
        - uptime
        - memoryUsage
        - issuance
        - credentials
        - keys
    CredentialStatusRequest:
      type: object
      properties:
        statusListCredential:
          type: string
          example: credential-identifier-123
        statusListIndex:
          type: string
          example: "1"
        optionalField:
          type: string
          example: Additional optional data
      required:
        - statusListCredential
        - statusListIndex
    VerifiedCredentialStatus:
      type: object
      properties:
        statusListCredential:
          type: string
          example: credential-identifier-123
        statusListIndex:
          type: string
          example: "1"
        statusPurpose:
          type: string
          example: refresh
          enum:
            - refresh
            - revocation
            - suspension
            - message
        status:
          type: boolean
          example: true
        message:
          type: string
          example: Optional verification message
      required:
        - statusListCredential
        - statusListIndex
        - statusPurpose
        - status
    DescriptorMap:
      type: object
      properties:
        id:
          type: string
          example: desc1
        format:
          type: string
          example: jwt
        path:
          type: string
          example: $.credential
        path_nested:
          example:
            id: desc-nested
            format: jwt
            path: $.nested
          allOf:
            - $ref: "#/components/schemas/DescriptorMap"
      required:
        - id
        - format
        - path
    PresentationSubmission:
      type: object
      properties:
        id:
          type: string
          example: submission-id
        definition_id:
          type: string
          example: definition-id
        descriptor_map:
          example:
            - id: desc1
              format: jwt
              path: $.credential
          type: array
          items:
            $ref: "#/components/schemas/DescriptorMap"
      required:
        - id
        - definition_id
        - descriptor_map
    AuthorizationResponse:
      type: object
      properties:
        vp_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
        presentation_submission:
          example:
            id: submission-id
            definition_id: definition-id
            descriptor_map: []
          allOf:
            - $ref: "#/components/schemas/PresentationSubmission"
        state:
          type: string
          example: state123
      required:
        - vp_token
        - presentation_submission
        - state
    JwtVpClaimFormat:
      type: object
      properties:
        alg:
          example:
            - Ed25519
          type: array
          items:
            type: string
      required:
        - alg
    Format:
      type: object
      properties:
        jwt_vp:
          example:
            alg:
              - ES256
          allOf:
            - $ref: "#/components/schemas/JwtVpClaimFormat"
    FilterItems:
      type: object
      properties:
        const:
          type: object
          example: example-const
        enum:
          example: &a27
            - 1
            - two
          type: array
          items:
            type: number
        exclusiveMinimum:
          type: object
          example: 0
        exclusiveMaximum:
          type: object
          example: 100
        format:
          type: string
          example: date-time
        minLength:
          type: number
          example: 1
        maxLength:
          type: number
          example: 255
        minimum:
          type: object
          example: 0
        maximum:
          type: object
          example: 100
        not:
          example: null
          allOf:
            - $ref: "#/components/schemas/FilterItems"
        pattern:
          type: string
          example: ^[A-Za-z]+$
        contains:
          example: null
          allOf:
            - $ref: "#/components/schemas/FilterItems"
        items:
          type: object
          example: &a28
            property:
              type: string
              format: default
    Filter:
      type: object
      properties:
        const:
          type: object
          example: example-const
        enum:
          example: *a27
          type: array
          items:
            type: number
        exclusiveMinimum:
          type: object
          example: 0
        exclusiveMaximum:
          type: object
          example: 100
        format:
          type: string
          example: date-time
        minLength:
          type: number
          example: 1
        maxLength:
          type: number
          example: 255
        minimum:
          type: object
          example: 0
        maximum:
          type: object
          example: 100
        not:
          example: null
          allOf:
            - $ref: "#/components/schemas/FilterItems"
        pattern:
          type: string
          example: ^[A-Za-z]+$
        contains:
          example: null
          allOf:
            - $ref: "#/components/schemas/FilterItems"
        items:
          type: object
          example: *a28
        type:
          type: string
          example: string
      required:
        - type
    Field:
      type: object
      properties:
        path:
          example:
            - $.example
          type: array
          items:
            type: string
        id:
          type: string
          example: field-id
        purpose:
          type: string
          example: Field purpose
        name:
          type: string
          example: Field name
        filter:
          example:
            type: string
            pattern: ^[A-Za-z]+$
          allOf:
            - $ref: "#/components/schemas/Filter"
        optional:
          type: boolean
          example: true
      required:
        - path
    Constraint:
      type: object
      properties:
        fields:
          example:
            - path:
                - $.example
              id: example-field
              purpose: Example purpose
              name: Example Name
              filter:
                type: string
                pattern: ^[A-Za-z]+$
              optional: false
          type: array
          items:
            $ref: "#/components/schemas/Field"
        limit_disclosure:
          type: string
          enum:
            - required
            - preferred
          example: preferred
    InputDescriptor:
      type: object
      properties:
        id:
          type: string
          example: 44d1f3d6-f65d-4a7c-84db-f92ba826305e
        name:
          type: string
          example: Example Input Descriptor
        purpose:
          type: string
          example: Example Purpose
        format:
          example:
            jwt_vp:
              alg:
                - ES256
          allOf:
            - $ref: "#/components/schemas/Format"
        constraints:
          example:
            fields: []
            limit_disclosure: preferred
          allOf:
            - $ref: "#/components/schemas/Constraint"
      required:
        - id
        - constraints
    PresentationDefinition:
      type: object
      properties:
        id:
          type: string
          example: 44d1f3d6-f65d-4a7c-84db-f92ba826305e
        input_descriptors:
          type: array
          items:
            $ref: "#/components/schemas/InputDescriptor"
        name:
          type: string
          example: Example Presentation Definition
        purpose:
          type: string
          example: Example Purpose
        format:
          example:
            jwt_vp:
              alg:
                - ES256
          allOf:
            - $ref: "#/components/schemas/Format"
      required:
        - id
        - input_descriptors
    VerifiablePresentationJwt:
      type: object
      properties:
        vp:
          type: string
      required:
        - vp
    JsonWebSignature2020:
      type: object
      properties:
        type:
          type: string
          enum:
            - JsonWebSignature2020
          example: JsonWebSignature2020
        proofPurpose:
          type: string
          example: assertionMethod
        created:
          type: string
          example: 2020-01-01T00:00:00Z
        jws:
          type: string
          example: eyJhbGciOiJFUzI1NiIsInR5cCI...
        verificationMethod:
          type: string
          example: did:example:123456#key-1
      required:
        - type
        - proofPurpose
        - created
        - jws
        - verificationMethod
    DataIntegrityProof:
      type: object
      properties:
        type:
          type: string
          enum: &a31
            - DataIntegrityProof
          example: DataIntegrityProof
        proofPurpose:
          type: string
          example: assertionMethod
        id:
          type: string
          example: did:example:xyz#proof-1
        verificationMethod:
          type: string
          example: did:example:author#verificationKey
        cryptosuite:
          type: string
          example: ecdsa-2019
        created:
          type: string
          example: 2021-01-01T00:00:00Z
        expires:
          type: string
          example: 2022-01-01T00:00:00Z
        domain:
          example: &a32
            - example.com
          type: array
          items:
            type: string
        challenge:
          type: string
          example: "1234567890"
        proofValue:
          type: string
          example: ProofValueString
        previousProof:
          example: &a33
            - PreviousProof1
            - PreviousProof2
          type: array
          items:
            type: string
        nonce:
          type: string
          example: nonce-string
      required:
        - type
        - proofPurpose
        - cryptosuite
        - proofValue
    StatusMessage:
      type: object
      properties:
        status:
          type: string
          example: deadbeef
        message:
          type: string
          example: Status message detail
      required:
        - status
        - message
    CredentialStatus:
      type: object
      properties:
        "@context":
          example:
            - https://w3id.org/dspace-dcp/v1.0/dcp.jsonld
          type: array
          items:
            type: string
        type:
          type: string
          example: CredentialStatus
        issuerPid:
          type: string
        holderPid:
          type: string
        status:
          type: string
          enum:
            - RECEIVED
            - REJECTED
            - ISSUED
      required:
        - "@context"
        - type
        - issuerPid
        - holderPid
        - status
    CredentialSubject:
      type: object
      properties:
        id:
          type: string
          example: did:example:subject-1
      required:
        - id
    Proof:
      type: object
      properties:
        type:
          type: string
          enum:
            - JsonWebSignature2020
            - DataIntegrityProof
          example: JsonWebSignature2020
        proofPurpose:
          type: string
          example: assertionMethod
      required:
        - type
        - proofPurpose
    VerifiableCredential:
      type: object
      properties:
        "@context":
          type: array
          example:
            - https://www.w3.org/2018/credentials/v1
          items:
            type: string
            enum:
              - https://www.w3.org/2018/credentials/v1
              - https://www.w3.org/ns/credentials/v2
              - https://w3id.org/security/suites/jws-2020/v1
              - https://w3id.org/security/data-integrity/v2
              - string
        type:
          example:
            - VerifiableCredential
            - TestCredential
          type: array
          items:
            type: string
        id:
          type: string
          example: http://example.edu/credentials/1872
        credentialSubject:
          additionalProperties: true
          example:
            id: did:example:subject-1
            customProp: value
          allOf:
            - $ref: "#/components/schemas/CredentialSubject"
        issuer:
          type: string
          example: did:example:issuer
        issuanceDate:
          type: string
          example: 2020-01-01T00:00:00Z
        expirationDate:
          type: string
          example: 2030-01-01T00:00:00Z
        validFrom:
          type: string
          example: 2020-01-01T00:00:00Z
        validUntil:
          type: string
          example: 2030-01-01T00:00:00Z
        evidence:
          type: object
          additionalProperties: true
          example:
            type: DocumentVerification
            verifier: did:example:verifier
        credentialStatus:
          oneOf:
            - &a29
              $ref: "#/components/schemas/CredentialStatus"
            - type: array
              items: *a29
        proof:
          example:
            - type: JsonWebSignature2020
              created: 2020-01-01T00:00:00Z
              proofPurpose: assertionMethod
              jws: eyJhbGciOiJFUzI1NiIsInR5cCI...
              verificationMethod: did:example:123456#key-1
          type: array
          items:
            $ref: "#/components/schemas/Proof"
      required:
        - "@context"
        - type
        - credentialSubject
        - issuer
        - proof
    VerifiablePresentation:
      type: object
      properties:
        "@context":
          example:
            "@context": https://www.w3.org/ns/credentials/v2
          type: array
          items:
            type: string
        type:
          example:
            - VerifiablePresentation
          type: array
          items:
            type: string
        id:
          type: string
          example: 3f2592da-ffc9-40cb-a336-a9daa9343ce8
        verifiableCredential:
          oneOf:
            - &a30
              $ref: "#/components/schemas/VerifiableCredential"
            - type: array
              items: *a30
        proof:
          oneOf:
            - $ref: "#/components/schemas/JsonWebSignature2020"
            - $ref: "#/components/schemas/DataIntegrityProof"
          example:
            type: JsonWebSignature2020
      required:
        - "@context"
        - type
        - verifiableCredential
        - proof
    VerifiablePresentationJsonLd:
      type: object
      properties:
        vp:
          $ref: "#/components/schemas/VerifiablePresentation"
      required:
        - vp
    PresentationValidation:
      type: object
      properties:
        vp:
          type: string
        valid:
          type: boolean
          example: true
        validateJWTSignature:
          type: boolean
          example: true
        validateJWTExpiryDate:
          type: boolean
          example: true
        validTrustAnchors:
          example:
            - true
          type: array
          items:
            type: boolean
        validExpiryDate:
          example:
            - true
          type: array
          items:
            type: boolean
        validProof:
          example:
            - true
          type: array
          items:
            type: boolean
        validStatus:
          example:
            - true
          type: array
          items:
            type: boolean
        validateAudience:
          type: boolean
          example: true
      required:
        - vp
        - valid
        - validateJWTSignature
        - validateJWTExpiryDate
        - validTrustAnchors
        - validExpiryDate
        - validProof
        - validStatus
    PresentationQueryMessage:
      type: object
      properties:
        "@context":
          type: array
          items:
            type: string
        type:
          type: string
          example: PresentationQueryMessage
        presentationDefinition:
          $ref: "#/components/schemas/PresentationDefinition"
        scope:
          example:
            - https://example.com/credential-1
          type: array
          items:
            type: string
      required:
        - "@context"
        - type
    PresentationResponseMessage:
      type: object
      properties:
        "@context":
          example:
            - https://w3id.org/dspace-dcp/v1.0/dcp.jsonld
          type: array
          items:
            type: string
        type:
          type: string
          example: PresentationResponseMessage
        presentation:
          type: array
          items:
            oneOf:
              - type: string
              - $ref: "#/components/schemas/VerifiablePresentation"
      required:
        - "@context"
        - type
        - presentation
    VerificationRequest:
      type: object
      properties:
        presentationDefinition:
          $ref: "#/components/schemas/PresentationDefinition"
        holderIdToken:
          type: string
      required:
        - presentationDefinition
        - holderIdToken
    ClientInfo:
      type: object
      properties:
        sub:
          type: string
          example: user-id-123
        name:
          type: string
          example: John Doe
        email:
          type: string
          example: john.doe@example.com
        didId:
          type: string
          example: did:example:123456789
        roles:
          example:
            - admin
            - user
          type: array
          items:
            type: string
        refreshToken:
          type: string
          example: refresh-token-abc123
      required:
        - sub
        - name
        - email
        - roles
    AuthenticatedUser:
      type: object
      properties:
        state:
          type: object
          example: authenticated
        user:
          example:
