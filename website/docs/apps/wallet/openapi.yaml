      type: object
      properties:
        alg_values_supported:
          example:
            - RSA-OAEP
          type: array
          items:
            type: string
        enc_values_supported:
          example:
            - A256GCM
          type: array
          items:
            type: string
        encryption_required:
          type: boolean
          example: true
      required:
        - alg_values_supported
        - enc_values_supported
        - encryption_required
    LogoDisplay:
      type: object
      properties:
        name:
          type: string
          example: Display Name
        locale:
          type: string
          example: en-US
        logo:
          example: *a38
          allOf:
            - $ref: "#/components/schemas/Logo"
    CredentialIssuerMetadata:
      type: object
      properties:
        credential_issuer:
          type: string
          example: https://issuer.example.com
        authorization_servers:
          example:
            - https://auth.example.com
          type: array
          items:
            type: string
        token_endpoint:
          type: string
          example: https://issuer.example.com/token
        credential_endpoint:
          type: string
          example: https://issuer.example.com/credential
        batch_credential_endpoint:
          type: string
          example: https://issuer.example.com/batch
        deferred_credential_endpoint:
          type: string
          example: https://issuer.example.com/deferred
        notification_endpoint:
          type: string
          example: https://issuer.example.com/notify
        credential_response_encryption:
          example:
            alg_values_supported:
              - RSA-OAEP
            enc_values_supported:
              - A256GCM
            encryption_required: true
          allOf:
            - $ref: "#/components/schemas/CredentialResponseEncryption"
        credential_identifiers_supported:
          type: boolean
          example: true
        signed_metadata:
          type: string
          example: signed-metadata-sample
        display:
          example:
            - name: Logo Display
              locale: en-US
              logo:
                uri: https://example.com/logo.png
                alt_text: Logo alt text
          type: array
          items:
            $ref: "#/components/schemas/LogoDisplay"
        credential_configurations_supported:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CredentialConfiguration"
          example:
            config-id:
              format: jwt_vc_json
              "@context":
                - https://www.w3.org/2018/credentials/v1
              scope: openid
              cryptographic_binding_methods_supported:
                - method1
                - method2
              credential_signing_alg_values_supported:
                - RS256
                - ES256
              proof_types_supported:
                example:
                  proof_signing_alg_values_supported:
                    - RS256
              credential_definition:
                "@context":
                  - https://www.w3.org/2018/credentials/v1
                type:
                  - VerifiableCredential
                credentialSubject:
                  id:
                    mandatory: true
                    value_type: string
                    display:
                      - name: ID
                        locale: en-US
              display:
                - name: Extended Display Name
                  locale: en-US
                  description: Extended display description
                  background_color: "#ffffff"
                  background_image:
                    uri: https://example.com/background.png
                  text_color: "#000000"
                  logo:
                    uri: https://example.com/logo.png
                    alt_text: Logo alt text
      required:
        - credential_issuer
        - credential_endpoint
        - credential_configurations_supported
    CredentialRequestCredential:
      type: object
      properties:
        format:
          type: string
        credentialType:
          type: string
      required:
        - format
        - credentialType
    CredentialRequestMessage:
      type: object
      properties:
        "@context":
          example:
            - https://w3id.org/dspace-dcp/v1.0/dcp.jsonld
          type: array
          items:
            type: string
        type:
          type: string
          example: CredentialRequestMessage
        holderPid:
          type: string
        credentials:
          type: array
          items:
            $ref: "#/components/schemas/CredentialRequestCredential"
      required:
        - "@context"
        - type
        - holderPid
        - credentials
    AuthorizationDetail:
      type: object
      properties:
        type:
          type: string
          example: openid_credential
        credential_configuration_id:
          type: string
          example: cred-config-123
        credential_identifiers:
          example:
            - id1
            - id2
          type: array
          items:
            type: string
      required:
        - type
        - credential_configuration_id
        - credential_identifiers
    AccessToken:
      type: object
      properties:
        access_token:
          type: string
          example: access-token-sample
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: number
          example: 3600
        refresh_token:
          type: string
          example: refresh-token-sample
        c_nonce:
          type: string
          example: c-nonce-sample
        c_nonce_expires_in:
          type: number
          example: 300
        authorization_details:
          example:
            - type: openid_credential
              credential_configuration_id: cred-config-123
              credential_identifiers:
                - id1
                - id2
          type: array
          items:
            $ref: "#/components/schemas/AuthorizationDetail"
      required:
        - access_token
        - authorization_details
    ImmediateCredentialResponse:
      type: object
      properties:
        credential:
          type: string
          example: credential-token-sample
        c_nonce:
          type: string
          example: c-nonce-123
        c_nonce_expires_in:
          type: number
          example: 3600
      required:
        - credential
    DeferredCredentialResponse:
      type: object
      properties:
        transaction_id:
          type: string
          example: tx-id-sample
        c_nonce:
          type: string
          example: c-nonce-123
        c_nonce_expires_in:
          type: number
          example: 3600
      required:
        - transaction_id
    JwtProof:
      type: object
      properties:
        proof_type:
          type: string
          example: jwt
        jwt:
          type: string
          example: jwt-token-sample
      required:
        - proof_type
        - jwt
    CwtProof:
      type: object
      properties:
        proof_type:
          type: string
          example: cbt
        cbt:
          type: string
          example: cbt-token-sample
      required:
        - proof_type
        - cbt
    VpProof:
      type: object
      properties:
        "@context":
          example:
            - https://www.w3.org/2018/credentials/v1
          type: array
          items:
            type: string
        type:
          example:
            - VerifiablePresentation
          type: array
          items:
            type: string
        holder:
          type: string
          example: holder-sample
        proof:
          example:
            id: proof-id-sample
            type: DataIntegrityProof
            cryptosuite: eddsa
            proofPurpose: authentication
            verificationMethod: verification-method-sample
            created: 2023-10-10T00:00:00Z
            expires: 2023-10-20T00:00:00Z
            domain: example.com
            challenge: challenge-sample
            proofValue: proof-value-sample
          allOf:
            - $ref: "#/components/schemas/DataIntegrityProof"
      required:
        - "@context"
        - type
        - holder
        - proof
    LdpVpProof:
      type: object
      properties:
        proof_type:
          type: string
          example: ldp_vp
        ldp_vp:
          example:
            "@context":
              - https://www.w3.org/2018/credentials/v1
            type:
              - VerifiablePresentation
            holder: holder-sample
            proof:
              id: proof-id-sample
              type: DataIntegrityProof
              cryptosuite: eddsa
              proofPurpose: authentication
              verificationMethod: verification-method-sample
              created: 2023-10-10T00:00:00Z
              expires: 2023-10-20T00:00:00Z
              domain: example.com
              challenge: challenge-sample
              proofValue: proof-value-sample
          allOf:
            - $ref: "#/components/schemas/VpProof"
      required:
        - proof_type
        - ldp_vp
    CredentialRequest:
      type: object
      properties:
        format:
          type: string
          enum:
            - jwt_vc_json-ld
            - jwt_vc_json
          example: jwt_vc_json-ld
        credential_definition:
          example:
            "@context":
              - https://www.w3.org/2018/credentials/v1
            type:
              - VerifiableCredential
            credentialSubject:
              id:
                mandatory: true
                value_type: string
                display:
                  - name: ID
                    locale: en-US
          allOf:
            - $ref: "#/components/schemas/CredentialDefinition"
        proof:
          oneOf:
            - $ref: "#/components/schemas/JwtProof"
            - $ref: "#/components/schemas/CwtProof"
            - $ref: "#/components/schemas/LdpVpProof"
          example:
            proof_type: jwt
            jwt: jwt-token-sample
      required:
        - format
        - credential_definition
        - proof
