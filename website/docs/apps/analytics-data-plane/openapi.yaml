openapi: 3.0.0
paths:
  /api/management/audit-logs:
    get:
      description: Fetches paginated audit log entries with optional filters.
      operationId: AuditLogController_list
      parameters:
        - name: order
          required: false
          in: query
          schema:
            default: DESC
            type: string
            enum:
              - ASC
              - DESC
        - name: order_by
          required: false
          in: query
          schema:
            default: modifiedDate
            type: string
        - name: page
          required: false
          in: query
          schema:
            minimum: 1
            default: 1
            type: number
        - name: per_page
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 100
            type: number
        - name: callerSub
          required: false
          in: query
          schema:
            type: string
        - name: callerType
          required: false
          in: query
          schema:
            type: string
        - name: resultAllowed
          required: false
          in: query
          schema:
            type: boolean
        - name: correlationId
          required: false
          in: query
          schema:
            type: string
        - name: ipAddress
          required: false
          in: query
          schema:
            type: string
        - name: requestPath
          required: false
          in: query
          schema:
            type: string
        - name: from
          required: false
          in: query
          schema:
            type: string
        - name: to
          required: false
          in: query
          schema:
            type: string
        - name: resourceType
          required: false
          in: query
          schema:
            type: array
            items:
              type: string
        - name: action
          required: false
          in: query
          schema:
            type: array
            items:
              type: string
        - name: severity
          required: false
          in: query
          schema:
            type: array
            items:
              type: string
              enum:
                - debug
                - info
                - warning
                - error
                - critical
      responses:
        "200":
          description: Successful response
          headers:
            x-page:
              description: Index of the current page (starting at 1)
              schema:
                type: integer
            x-prev-page:
              description: Index of the previous page
              schema:
                type: integer
              required: false
            x-next-page:
              description: Index of the next page
              schema:
                type: integer
              required: false
            x-per-page:
              description: Number of items per page
              schema:
                type: integer
            x-total-pages:
              description: Total number of pages
              schema:
                type: integer
            x-total:
              description: Total number of items
              schema:
                type: integer
            link:
              description: Web Linking to other pages of this resource
              schema:
                type: string
      security:
        - oauth2:
            - read:adp.audit_log
      summary: List audit log entries
      tags: &a1
        - Audit Logs
  /api/management/audit-logs/{id}:
    get:
      description: Fetches a single audit log entry by its ID.
      operationId: AuditLogController_getById
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      security:
        - oauth2:
            - read:adp.audit_log
      summary: Get audit log entry by ID
      tags: *a1
  /api/settings:
    get:
      description: Retrieves the settings of the control plane.
      operationId: ConfigController_getSettings
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeConfigDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security: &a2
        - oauth2:
            - update:adp.config
      summary: Retrieve settings
      tags: &a3
        - Settings
  /api/settings/mode:
    get:
      description: Retrieves the analytics data plane runtime mode
        (standalone/client/server).
      operationId: ConfigController_getMode
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode:
                    type: string
                    example: standalone
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security: *a2
      summary: Retrieve runtime mode
      tags: *a3
  /api/settings/update:
    post:
      description: Updates runtime settings for the control plane.
      operationId: ConfigController_updateSettings
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeConfigDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeConfigDto"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security: *a2
      summary: Update settings
      tags: *a3
  /api/settings/upload:
    post:
      description: Uploads logo for the control plane, receive a base64 encoded url.
      operationId: ConfigController_uploadFile
      parameters: []
      responses:
        "200":
          description: ""
      security: *a2
      summary: Upload logo
      tags: *a3
  /api/catalog:
    get:
      description: Get catalog, currently not implemented.
      operationId: DataPlaneController_getCatalog
      parameters: []
      responses:
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "501":
          description: ""
      security: &a4
        - oauth2:
            - read:adp.dataplane
      summary: Get catalog
      tags: &a5
        - Data Plane
  /health:
    get:
      description: Retrieves the current health of the control plane. If the control
        plane is running it always returns an empty 200 OK
      operationId: DataPlaneController_healthCheck
      parameters: []
      responses:
        "200":
          description: ""
        "502":
          description: ""
      security: *a4
      summary: Health check
      tags: *a5
  /api/management/state:
    get:
      description: Get the state of the data plane, consisting of the id, details and
        the dataset.
      operationId: DataPlaneManagementController_getState
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataPlaneStateDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security:
        - oauth2:
            - read:adp.dataplane
      summary: Get Data Plane state
      tags: &a6
        - Data Plane Management
  /api/management/catalog:
    get:
      description: Get the current catalog from the Control Plane.
      operationId: DataPlaneManagementController_getCatalog
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogSchema"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security:
        - oauth2:
            - read:adp.dataplane
      summary: Get catalog
      tags: *a6
  /api/management/registry/addresses:
    get:
      description: Get all participant addresses from the Control Plane registry.
      operationId: DataPlaneManagementController_getRegistryAddresses
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security:
        - oauth2:
            - read:adp.dataplane
      summary: Get registry addresses
      tags: *a6
  /api/management/registry/catalog/{participantId}:
    get:
      description: Fetches a specific catalog by its participant ID.
      operationId: DataPlaneManagementController_getCatalogByParticipantId
      parameters:
        - name: participantId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogSchema"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security:
        - oauth2:
            - read:adp.dataplane
      summary: Get catalog by participant ID
      tags: *a6
  /api/management/registry/refresh:
    post:
      description: Force refresh the registry by triggering a re-crawl of all
        participant addresses and catalogs on the Control Plane.
      operationId: DataPlaneManagementController_refreshRegistry
      parameters: []
      responses:
        "200":
          description: Registry refresh initiated successfully
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security:
        - oauth2:
            - read:adp.dataplane
      summary: Refresh registry
      tags: *a6
  /api/management/participant-id:
    get:
      description: Get the ID of the current participant from the Control Plane catalog.
      operationId: DataPlaneManagementController_getParticipantId
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security:
        - oauth2:
            - read:adp.dataplane
      summary: Get current participant ID
      tags: *a6
  /api/management/refresh:
    post:
      description: Use this endpoint to (re)register your data plane. Currently it
        will register with defaults from the config.
      operationId: DataPlaneManagementController_refreshRegistration
      parameters: []
      responses:
        "202":
          description: ""
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security:
        - oauth2:
            - update:adp.dataplane
      summary: (Re)register data plane
      tags: *a6
  /api/management/dataset:
    get:
      description: Get the current dataset configuration.
      operationId: DataPlaneManagementController_getDatasetConfig
      parameters: []
      responses:
        "200":
          description: ""
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security:
        - oauth2:
            - read:adp.dataplane
      summary: Get dataset
      tags: *a6
    put:
      description: Update an existing dataset by id.
      operationId: DataPlaneManagementController_updateDatasetConfig
      parameters:
        - name: datasetId
          required: true
          in: query
          description: Dataset ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
      responses:
        "200":
          description: ""
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security:
        - oauth2:
            - update:adp.dataplane
      summary: Update dataset
      tags: *a6
    post:
      description: Add a new dataset.
      operationId: DataPlaneManagementController_addDataset
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
      responses:
        "200":
          description: ""
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security:
        - oauth2:
            - create:adp.dataplane
      summary: Add dataset
      tags: *a6
    delete:
      description: Delete an existing dataset by id.
      operationId: DataPlaneManagementController_deleteDataset
      parameters:
        - name: datasetId
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security:
        - oauth2:
            - delete:adp.dataplane
      summary: Delete dataset
      tags: *a6
  /api/transfers/request/{role}:
    post:
      description: Requests a transfer from control plane to data plane.
      operationId: TransferController_requestTransfer
      parameters:
        - name: role
          required: true
          in: path
          schema:
            type: string
        - name: processId
          required: true
          in: query
          schema:
            type: string
        - name: x-remote-party
          required: true
          in: header
          schema:
            type: string
        - name: x-dataset-id
          required: true
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRequestMessageSchema"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataPlaneRequestResponseDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security:
        - oauth2:
            - create:dp.transfer
      summary: Request Transfer
      tags: &a7
        - Data Plane
  /api/transfers/{id}/start:
    post:
      operationId: TransferController_startTransfer
      parameters:
        - name: id
          required: true
          in: path
          description: Transfer ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferStartMessageSchema"
      responses:
        "202":
          description: Transfer started successfully
      security:
        - oauth2:
            - execute:dp.transfer
      summary: Start transfer process
      tags: *a7
  /api/transfers/{id}/completion:
    post:
      operationId: TransferController_completeTransfer
      parameters:
        - name: id
          required: true
          in: path
          description: Transfer ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferCompletionMessageSchema"
      responses:
        "202":
          description: Transfer completed successfully
      security:
        - oauth2:
            - execute:dp.transfer
      summary: Complete transfer process
      tags: *a7
  /api/transfers/{id}/termination:
    post:
      operationId: TransferController_terminateTransfer
      parameters:
        - name: id
          required: true
          in: path
          description: Transfer ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferTerminationMessageSchema"
      responses:
        "202":
          description: Transfer terminated successfully
      security:
        - oauth2:
            - execute:dp.transfer
      summary: Terminate transfer process
      tags: *a7
  /api/transfers/{id}/suspension:
    post:
      operationId: TransferController_suspendTransfer
      parameters:
        - name: id
          required: true
          in: path
          description: Transfer ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferSuspensionMessageSchema"
      responses:
        "202":
          description: Transfer suspended successfully
      security:
        - oauth2:
            - execute:dp.transfer
      summary: Suspend transfer process
      tags: *a7
  /api/management/transfers:
    get:
      operationId: TransfersManagementController_getTransfers
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransferDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security:
        - oauth2:
            - read:dp.transfer
      summary: Get all transfers
      tags: &a8
        - Data Plane Management
  /api/management/transfers/{id}:
    get:
      operationId: TransfersManagementController_getTransfer
      parameters:
        - name: id
          required: true
          in: path
          description: Transfer identifier
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security:
        - oauth2:
            - read:dp.transfer
      summary: Get transfer by ID
      tags: *a8
  /api/management/transfers/{id}/metadata:
    get:
      operationId: TransfersManagementController_getMetadata
      parameters:
        - name: id
          required: true
          in: path
          description: Transfer identifier
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security:
        - oauth2:
            - read:dp.transfer
      summary: Get metadata of transfer by ID
      tags: *a8
  /api/management/transfers/{id}/start:
    post:
      operationId: TransfersManagementController_startTransfer
      parameters:
        - name: id
          required: true
          in: path
          description: Transfer identifier
          schema:
            type: string
      responses:
        "202":
          description: ""
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security:
        - oauth2:
            - execute:dp.transfer
      summary: Start a transfer by ID
      tags: *a8
  /api/management/transfers/{id}/completion:
    post:
      operationId: TransfersManagementController_completeTransfer
      parameters:
        - name: id
          required: true
          in: path
          description: Transfer identifier
          schema:
            type: string
      responses:
        "202":
          description: ""
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security:
        - oauth2:
            - execute:dp.transfer
      summary: Complete a transfer by ID
      tags: *a8
  /api/management/transfers/{id}/termination:
    post:
      operationId: TransfersManagementController_terminateTransfer
      parameters:
        - name: id
          required: true
          in: path
          description: Transfer identifier
          schema:
            type: string
        - name: code
          required: true
          in: query
          schema:
            type: string
        - name: reason
          required: true
          in: query
          schema:
            type: string
      responses:
        "202":
          description: ""
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security:
        - oauth2:
            - execute:dp.transfer
      summary: Terminate a transfer by ID
      tags: *a8
  /api/management/transfers/{id}/suspension:
    post:
      operationId: TransfersManagementController_suspendTransfer
      parameters:
        - name: id
          required: true
          in: path
          description: Transfer identifier
          schema:
            type: string
        - name: reason
          required: true
          in: query
          schema:
            type: string
      responses:
        "202":
          description: ""
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security:
        - oauth2:
            - execute:dp.transfer
      summary: Suspend a transfer by ID
      tags: *a8
  /api/auth/user:
    get:
      description: Retrieves current user state, whether someone is logged in or not a
        200 result is provided. This is used in the frontend to determine
        whether certain aspects should be shown.
      operationId: AuthController_getUser
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticatedUser"
                  - $ref: "#/components/schemas/UnauthenticatedUser"
      summary: Retrieve current user status
      tags: &a9
        - Authentication
  /api/auth/login:
    get:
      description: Redirects user to the correct authorization server
      operationId: AuthController_login
      parameters: []
      responses:
        "302":
          description: ""
      summary: Login redirect
      tags: *a9
  /api/auth/logout:
    get:
      description: Removes session information and redirects user the root of the
        frontend (`auth.redirectURL`)
      operationId: AuthController_logout
      parameters: []
      responses:
        "302":
          description: ""
      summary: Logout redirect
      tags: *a9
  /api/auth/callback:
    get:
      description: Users are redirected from the authorization server to this endpoint
        which will redirect them to the frontend (`auth.redirectURL`)
      operationId: AuthController_callback
      parameters:
        - name: state
          required: false
          in: query
          description: The state parameter
          schema:
            example: randomState
            type: string
        - name: code
          required: false
          in: query
          description: The authorization code
          schema:
            example: code
            type: string
        - name: access_token
          required: false
          in: query
          description: The access token
          schema:
            type: string
        - name: token_type
          required: false
          in: query
          description: The token type
          schema:
            example: Bearer
            type: string
        - name: expires_in
          required: false
          in: query
          description: The token expiration in seconds
          schema:
            example: 3600
            type: string
        - name: id_token
          required: false
          in: query
          description: The ID token
          schema:
            type: string
        - name: code_verifier
          required: false
          in: query
          description: The code verifier
          schema:
            example: randomChallengeVerifier
            type: string
      responses:
        "302":
          description: ""
      summary: Login callback
      tags: *a9
  /api/files:
    get:
      description: Get all files and their metadata.
      operationId: FilesController_getFiles
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FileMetadataDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security:
        - oauth2:
            - read:adp.file
      summary: Get all files
      tags: &a10
        - Files
  /api/files/upload:
    post:
      description: Upload files and create metadata.
      operationId: FilesController_uploadFile
      parameters: []
      responses:
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security:
        - oauth2:
            - create:adp.file
      summary: Upload files
      tags: *a10
  /api/files/sync:
    post:
      description: Sync files and their metadata.
      operationId: FilesController_syncFiles
      parameters: []
      responses:
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security:
        - oauth2:
            - execute:adp.file
      summary: Sync files
      tags: *a10
  /api/files/{id}:
    get:
      description: Get the file by ID.
      operationId: FilesController_getFile
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: Authorization
          required: true
          in: header
          schema:
            type: string
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ""
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      summary: Get file
