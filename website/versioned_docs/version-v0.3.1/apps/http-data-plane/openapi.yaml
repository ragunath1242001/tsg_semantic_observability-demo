      responses:
        "200":
          description: ""
info:
  title: TSG HTTP Data Plane
  description: This OpenAPI specification shows the endpoints of the HTTP Data Plane.
  version: "1.0"
  contact: {}
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
tags:
  - name: Health
    description: Health Controller
  - name: Settings
    description: Settings Controller
  - name: Authentication
    description: Authentication Controller
  - name: Data Plane
    description: Data Plane Management Controller
  - name: Data Plane Management
    description: Data Plane Management Controller
  - name: Catalog
    description: Catalog Controller
  - name: Catalog Management
    description: Catalog Management Controller
  - name: Negotiations
    description: Negotiations Controller
  - name: Negotiations Management
    description: Negotiations Management Controller
  - name: Transfers
    description: Transfers Controller
  - name: Transfers Management
    description: Transfers Management Controller
  - name: Registry
    description: Registry Controller
  - name: Registry Management
    description: Registry Management Controller
servers: []
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        password:
          scopes:
            httpdataplane_admin: httpdataplane_admin
            httpdataplane_dataplane: httpdataplane_dataplane
    bearer:
      scheme: bearer
      bearerFormat: VP
      type: http
      description: Verifiable Presentation needed to communicate between two instances
        of the control plane.
  schemas:
    DatasetConfig:
      type: object
      properties: {}
    ClientInfoDto:
      type: object
      properties:
        sub:
          type: string
        name:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            type: string
      required:
        - sub
        - name
        - email
        - roles
    AuthenticatedUserDto:
      type: object
      properties:
        state:
          type: object
        user:
          $ref: "#/components/schemas/ClientInfoDto"
      required:
        - state
        - user
    UnauthenticatedUserDto:
      type: object
      properties:
        state:
          type: object
      required:
        - state
externalDocs:
  description: Git Repository
  url: https://gitlab.com/tno-tsg/dataspace-protocol/tno-security-gateway
