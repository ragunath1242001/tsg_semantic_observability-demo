openapi: 3.0.0
paths:
  /health:
    get:
      description: Retrieves the current health of the wallet. If the wallet is
        running it always returns an empty 200 OK
      operationId: HealthController_getHealth
      parameters: []
      responses:
        "200":
          description: ""
        "502":
          description: ""
        "503":
          description: The Health Check is not successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  info:
                    type: object
                    example:
                      database: &a1
                        status: up
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  error:
                    type: object
                    example:
                      redis: &a2
                        status: down
                        message: Could not connect
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  details:
                    type: object
                    example:
                      database: *a1
                      redis: *a2
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
      summary: Health check
      tags:
        - Health
  /api/settings:
    get:
      description: Retrieve dynamic settings for this wallet
      operationId: ConfigController_getSettings
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeConfigDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security: &a3
        - oauth2:
            - wallet_issue_credentials
      summary: Retrieve settings
      tags: &a4
        - Settings
  /api/settings/update:
    post:
      description: Update the dynamic settings for this wallet
      operationId: ConfigController_updateSettings
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeConfigDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeConfigDto"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security: *a3
      summary: Update settings
      tags: *a4
  /api/status:
    get:
      description: Retrieves the current health of the control plane. With additional
        status information
      operationId: StatusController_getStatus
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusDto"
      responses:
        "200":
          description: ""
        "502":
          description: ""
      summary: Appplication status
      tags:
        - Status
  /api/presentations:
    get:
      description: Generates a Veriable Presentation in Jwt or JSON-LD format for one
        of the credentials in this wallet
      operationId: DirectPresentationController_createPresentation
      parameters:
        - name: credentialId
          required: true
          in: query
          schema:
            type: string
        - name: asJwt
          required: true
          in: query
          schema:
            type: boolean
        - name: unwrap
          required: true
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/VerifiablePresentationJwtDto"
                  - $ref: "#/components/schemas/VerifiablePresentationJsonLdDto"
      security: &a5
        - oauth2:
            - wallet_view_presentations
      summary: Request a presentation
      tags: &a6
        - Presentation Direct
  /api/presentations/validate:
    post:
      description: Validates a Jwt-based Verifiable Presentation according to a fixed
        set of requirements
      operationId: DirectPresentationController_validatePresentation
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifiablePresentationJwtDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationValidationDto"
      security: *a5
      summary: Validate presentation
      tags: *a6
  /api/iatp/holder/token:
    get:
      description: Generates a SIOP token for the provided audience to allow it to
        request presentations
      operationId: IatpHolderController_createSIToken
      parameters:
        - name: audience
          required: true
          in: query
          schema:
            type: string
        - name: scope
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  id_token:
                    type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      security:
        - oauth2:
            - wallet_view_presentations
      summary: Request a SIOP token
      tags: &a7
        - Presentation IATP
  /api/iatp/holder/presentation:
    get:
      description: Request a presentation with a SIOP-token and a presentation definition
      operationId: IatpHolderController_getPresentation
      parameters:
        - name: presentation_definition
          required: true
          in: query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationResponseDto"
        - name: Authorization
          required: true
          in: header
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationResponseDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
      summary: Retrieve presentation
      tags: *a7
  /api/iatp/verifier/verify:
    post:
      description: Request a new IATP presentation flow to start as verifier, based on
        a presentation defintion and a holder SIOP token
      operationId: IatpVerifierController_verify
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
