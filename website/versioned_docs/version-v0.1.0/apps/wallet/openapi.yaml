      summary: Revoke offer
      tags: *a23
info:
  title: TSG Wallet
  description: >-
    The TSG Wallet is a SSI wallet that can issue and store verifiable
    credentials and create presentations to be used within data spaces.<br /><br
    />
        The wallet is aimed at multi-tier deployments, with one (or more) wallet that acts as trust anchor for a data space and indivual wallets for each of the participants in the data space. On this page the central wallet that issues credentials will be called the Dataspace Wallet although it is not required that there always is exactly one issuer of credentials in a dataspace.<br /><br />
        __*Note*__: This OpenAPI definition is not intended to be directly linked with a single Wallet instance. 
  version: ""
  contact: {}
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
tags:
  - name: Health
    description: Health controller
  - name: Settings
    description: Settings controller
  - name: Authentication
    description: Authentication Controller
  - name: DID
    description: DID Controller
  - name: Contexts
    description: Contexts Controller
  - name: Keys
    description: Keys Controller
  - name: Credentials
    description: Credentials Controller
  - name: Management DID
    description: Management DID Controller
  - name: Management Contexts
    description: Management Contexts Controller
  - name: Management Keys
    description: Management Keys Controller
  - name: Management Credentials
    description: Management Credentials Controller
  - name: Management Gaia-X Credentials
    description: Management Gaia-X Credentials Controller
  - name: OpenID 4 Verifiable Credential Issuance
    description: OpenID 4 Verifiable Credential Issuance Controller
  - name: Presentation IATP
    description: Presentation IATP Controller
  - name: Presentation Direct
    description: Presentation Direct Controller
servers: []
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        password:
          scopes:
            wallet_view_did: wallet_view_did
            wallet_manage_keys: wallet_manage_keys
            wallet_use_keys: wallet_use_keys
            wallet_view_own_credentials: wallet_view_own_credentials
            wallet_view_all_credentials: wallet_view_all_credentials
            wallet_manage_own_credentials: wallet_manage_own_credentials
            wallet_manage_all_credentials: wallet_manage_all_credentials
            wallet_issue_credentials: wallet_issue_credentials
            wallet_view_presentations: wallet_view_presentations
  schemas:
    RuntimeConfigDto:
      type: object
      properties:
        gaiaXSupport:
          type: boolean
      required:
        - gaiaXSupport
    ErrorDto:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
        code:
          type: number
        message:
          type: object
        error:
          type: string
      required:
        - name
        - status
        - code
    DatabaseStatusDto:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MemoryUsageDto:
      type: object
      properties:
        does_zap_garbage:
          type: number
        external_memory:
          type: number
        heap_size_limit:
          type: number
        malloced_memory:
          type: number
        number_of_detached_contexts:
          type: number
        number_of_native_contexts:
          type: number
        peak_malloced_memory:
          type: number
        total_available_size:
          type: number
        total_global_handles_size:
          type: number
        total_heap_size:
          type: number
        total_heap_size_executable:
          type: number
        total_physical_size:
          type: number
        used_global_handles_size:
          type: number
        used_heap_size:
          type: number
      required:
        - does_zap_garbage
        - external_memory
        - heap_size_limit
        - malloced_memory
        - number_of_detached_contexts
        - number_of_native_contexts
        - peak_malloced_memory
        - total_available_size
        - total_global_handles_size
        - total_heap_size
        - total_heap_size_executable
        - total_physical_size
        - used_global_handles_size
        - used_heap_size
    IssuanceStatusDto:
      type: object
      properties:
        issued:
          type: number
        open:
          type: number
      required:
        - issued
        - open
    CredentialStatusDto:
      type: object
      properties:
        selfSigned:
          type: number
        thirdParty:
          type: number
      required:
        - selfSigned
        - thirdParty
    StatusDto:
      type: object
      properties:
        database:
          $ref: "#/components/schemas/DatabaseStatusDto"
        uptime:
          type: number
        memoryUsage:
          $ref: "#/components/schemas/MemoryUsageDto"
        issuance:
          $ref: "#/components/schemas/IssuanceStatusDto"
        credentials:
          $ref: "#/components/schemas/CredentialStatusDto"
        keys:
          type: number
      required:
        - database
        - uptime
        - memoryUsage
        - issuance
        - credentials
        - keys
    VerifiablePresentationJwtDto:
      type: object
      properties:
        vp:
          type: string
      required:
        - vp
    DataIntegrityProofDto:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        proofPurpose:
          type: string
        verificationMethod:
          type: string
        cryptosuite:
          type: string
        created:
          type: string
        expires:
          type: string
        domain:
          oneOf:
            - &a24
              type: string
            - type: array
              items: *a24
        challenge:
          type: string
        proofValue:
          type: string
        previousProof:
          oneOf:
            - &a25
              type: string
            - type: array
              items: *a25
        nonce:
          type: string
      required:
        - type
        - proofPurpose
        - cryptosuite
        - proofValue
    VerifiableCredentialDto:
      type: object
      properties:
        "@context":
          type: array
          items:
            type: string
        type:
          type: array
          items:
            type: string
        id:
          type: string
        credentialSubject:
          oneOf:
            - $ref: "#/components/schemas/DefaultCredentialSubjectDto"
            - type: array
              items:
                $ref: "#/components/schemas/DefaultCredentialSubjectDto"
        issuer:
          type: string
        expirationDate:
          type: string
          format: date-time
        issuanceDate:
          type: string
          format: date-time
        evidence:
          type: object
        proof:
          oneOf:
            - &a26
              oneOf:
                - $ref: "#/components/schemas/DataIntegrityProofDto"
                - $ref: "#/components/schemas/JsonWebSignature2020Dto"
            - type: array
              items: *a26
      required:
        - "@context"
        - type
        - credentialSubject
        - issuer
        - issuanceDate
        - proof
    VerifiablePresentationJsonLdDto:
      type: object
      properties:
        vp:
          $ref: "#/components/schemas/VerifiableCredentialDto"
      required:
        - vp
    PresentationValidationDto:
      type: object
      properties:
        valid:
          type: boolean
        validateJWTSignature:
          type: boolean
        validateJWTExpiryDate:
          type: boolean
        validateTrustAnchors:
          type: array
          items:
            type: boolean
        validateExpiryDate:
          type: array
          items:
            type: boolean
        validateCredentials:
          type: array
          items:
            type: boolean
        validateAudience:
          type: boolean
        vp:
          type: string
      required:
        - valid
        - validateJWTSignature
        - validateJWTExpiryDate
        - validateTrustAnchors
        - validateExpiryDate
        - validateCredentials
        - vp
    FormatDto:
      type: object
      properties:
        jwt_vp:
          type: object
          properties:
            alg:
              type: array
              items:
                type: string
    FieldDto:
      type: object
      properties:
        path:
          type: array
          items:
            type: string
        id:
          type: string
        purpose:
          type: string
        name:
          type: string
        filter:
          type: object
        optional:
          type: boolean
      required:
        - path
    ConstraintDto:
      type: object
      properties:
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldDto"
        limit_disclosure:
          type: string
          enum:
            - required
            - preferred
    InputDescriptorDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        purpose:
          type: string
        format:
          $ref: "#/components/schemas/FormatDto"
        constraints:
          $ref: "#/components/schemas/ConstraintDto"
      required:
        - id
        - constraints
    PresentationDefinitionDto:
      type: object
      properties:
        id:
          type: string
        input_descriptors:
          type: array
          items:
            $ref: "#/components/schemas/InputDescriptorDto"
        name:
          type: string
        purpose:
          type: string
        format:
          $ref: "#/components/schemas/FormatDto"
      required:
        - id
        - input_descriptors
    DescriptorMapDto:
      type: object
      properties:
        id:
          type: string
        format:
          type: string
        path:
          type: string
        path_nested:
          $ref: "#/components/schemas/DescriptorMapDto"
      required:
        - id
        - format
        - path
    PresentationSubmissionDto:
      type: object
      properties:
        id:
          type: string
        definition_id:
          type: string
        descriptor_map:
          type: array
          items:
            $ref: "#/components/schemas/DescriptorMapDto"
      required:
        - id
        - definition_id
        - descriptor_map
    PresentationResponseDto:
      type: object
      properties:
        vp_token:
          type: string
        presentation_submission:
          $ref: "#/components/schemas/PresentationSubmissionDto"
      required:
        - vp_token
        - presentation_submission
    VerificationRequestDto:
      type: object
      properties:
        presentationDefinition:
          $ref: "#/components/schemas/PresentationDefinitionDto"
        holderIdToken:
          type: string
      required:
        - presentationDefinition
        - holderIdToken
    VerifiablePresentationDto:
      type: object
      properties:
        "@context":
          type: array
          items:
            type: string
        type:
          type: array
          items:
            type: string
        id:
          type: string
        verifiableCredential:
          oneOf:
            - &a27
              $ref: "#/components/schemas/VerifiableCredentialDto"
            - type: array
              items: *a27
      required:
        - "@context"
        - type
        - verifiableCredential
    AppRole:
      type: string
      enum:
        - wallet_view_did
        - wallet_manage_keys
        - wallet_use_keys
        - wallet_view_own_credentials
        - wallet_view_all_credentials
        - wallet_manage_own_credentials
        - wallet_manage_all_credentials
        - wallet_issue_credentials
        - wallet_view_presentations
    ClientInfoDto:
      type: object
      properties:
        sub:
          type: string
        name:
          type: string
        email:
          type: string
        didId:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/AppRole"
      required:
        - sub
        - name
        - email
        - didId
        - roles
    AuthenticatedUserDto:
      type: object
      properties:
        state:
          type: string
        user:
          $ref: "#/components/schemas/ClientInfoDto"
      required:
        - state
        - user
    UnauthenticatedUserDto:
      type: object
      properties:
        state:
          type: string
      required:
        - state
    CredentialsDto:
      type: object
      properties:
        id:
          type: string
        targetDid:
          type: string
        credential:
          $ref: "#/components/schemas/VerifiableCredentialDto"
        selfIssued:
          type: boolean
        created:
          format: date-time
          type: string
        modified:
          format: date-time
          type: string
        deleted:
          format: date-time
          type: string
      required:
        - id
        - targetDid
        - credential
        - selfIssued
        - created
        - modified
    DefaultCredentialSubjectDto:
      type: object
      properties:
        id:
          type: string
      required:
        - id
    CredentialConfigDto:
      type: object
      properties:
        context:
          title: JSON-LD Contexts for the credential
          example:
            - https://dataspace.example/context
          type: array
          items:
            type: string
        type:
          title: Credential Type
          example:
            - DataSpaceMembershipCredential
          type: array
          items:
            type: string
        id:
          type: string
          title: Credential ID
        keyId:
          type: string
        credentialSubject:
          $ref: "#/components/schemas/DefaultCredentialSubjectDto"
      required:
        - id
        - credentialSubject
    LegalRegistrationNumberRequestDto:
      type: object
      properties:
        vcId:
          type: string
        clearingHouse:
          type: string
