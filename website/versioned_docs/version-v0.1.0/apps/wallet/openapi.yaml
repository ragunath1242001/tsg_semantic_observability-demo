                $ref: "#/components/schemas/ErrorDto"
      security: *a21
      summary: Update context
      tags: *a22
    delete:
      description: Delete an existing context in this wallet
      operationId: ContextManagementController_deleteContext
      parameters:
        - name: id
          required: true
